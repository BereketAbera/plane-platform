# Modified from apps/admin/nginx/nginx.conf in Plane v1.4.3, with the same changes as nginx-web.conf.
# /source is not here: the ingress sends it to the web image.
worker_processes 2;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;

  access_log /dev/stdout;
  error_log /dev/stderr;

  # How long a browser may keep a response, from what its name promises. Without this nginx sends ETag and
  # Last-Modified alone, and a browser then reuses the file without asking for about a tenth of its age, so a promotion
  # or a rollback can go unseen with no error. Only the bundler's output under /god-mode/assets/ carries a hash of its content in
  # its name, <stem>-<8 characters>, with a counter after them when the bundler needed one, so only that can never go
  # stale. Everything else, including whatever is not a file, must be asked about each time, and ETag still saves the bytes.
  #
  # add_header reads $uri as the response starts, after try_files has run. A missing hashed file has fallen back
  # to /god-mode/index.html by then, so it is /god-mode/index.html here, and HTML is never kept for a year under an asset's name.
  # checks/cache-names.sh and checks/smoke-images.sh test all of this.
  map $uri $wayline_cache_control {
    default  "no-cache";
    "~^/god-mode/assets/[^/]+-[A-Za-z0-9_-]{8}[0-9]*\.[A-Za-z0-9]+$"  "public, max-age=31536000, immutable";
  }

  server {
    listen 3000;

    # A location with its own add_header would lose every one of these, so all of them stay here, and no location has one.
    add_header Cache-Control $wayline_cache_control always;
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /god-mode/index.html;
    }
  }
}
