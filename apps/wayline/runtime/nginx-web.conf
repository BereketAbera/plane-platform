# Modified from apps/web/nginx/nginx.conf in Plane v1.4.3. Fits the UID 101 hardening patch: pid and
# temp files stay on the emptyDirs mounted at /run and /var/cache/nginx. Two workers, and the unused
# rate-limit zone is gone, because the memory limit is 64 MiB.
worker_processes 2;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # AGPL section 13: the offer of Corresponding Source. The Dockerfile fills this in at build time
    # with the repository at the commit that built this image.
    location = /source {
      return 302 __WAYLINE_SOURCE_URL__;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}
