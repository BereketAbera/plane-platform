#
# Modified from apps/web/nginx/nginx.conf in Plane v1.4.3. Fits the UID 101 hardening patch: pid and
# temp files stay on the emptyDirs mounted at /run and /var/cache/nginx. Two workers, and the unused
# rate-limit zone is gone, because the memory limit is 64 MiB.
worker_processes 2;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;

  access_log /dev/stdout;
  error_log /dev/stderr;

  # How long a browser may keep a response, from what its name promises. Without this nginx sends ETag and
  # Last-Modified alone, and a browser then reuses the file without asking for about a tenth of its age, so a promotion
  # or a rollback can go unseen with no error. Only the bundler's output under /assets/ carries a hash of its content in
  # its name, <stem>-<8 characters>, with a counter after them when the bundler needed one, so only that can never go
  # stale. Everything else, including whatever is not a file, must be asked about each time, and ETag still saves the bytes.
  #
  # add_header reads this as the response starts, after try_files has run. A missing hashed file has fallen back
  # to /index.html by then, so it is /index.html here, and HTML is never kept for a year under an asset's name.
  # The status is part of the key because the name says nothing about the answer. A browser keeps a 403 for a real hashed
  # name, sent with the year, after the server recovers: docs/evidence/branding/cache-errors.txt.
  # 206 reaches this map in no case: byte ranges are off, below, and nginx's range filter runs after add_header anyway.
  # checks/cache-names.sh and checks/smoke-images.sh test all of this.
  map "$status:$uri" $wayline_cache_control {
    default  "no-cache";
    "~^(200|206|304):/assets/[^/]+-[A-Za-z0-9_-]{8}[0-9]*\.[A-Za-z0-9]+$"  "public, max-age=31536000, immutable";
  }

  server {
    listen 3000;

    # nginx's own redirects, for a directory asked for without its slash, would otherwise name this port, which the ingress
    # does not serve. A relative Location also leaves port_in_redirect with nothing to do. /source names its full URL itself.
    absolute_redirect off;

    # nginx looks at a range after add_header has run with status 200. So a range past a file's end gets a 416 with the
    # year, and with every header here twice, and nothing in this config can tell that from a good range. No file in this
    # image needs part of a file: no audio, video or PDF, and nothing over about 2 MiB. So a Range header is ignored, and
    # the answer is the whole file with status 200.
    max_ranges 0;

    # A location with its own add_header would lose every one of these, so all of them stay here, and no location has one.
    add_header Cache-Control $wayline_cache_control always;
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # AGPL section 13: the offer of Corresponding Source. The Dockerfile fills this in at build time
    # with the repository at the commit that built this image.
    location = /source {
      return 302 __WAYLINE_SOURCE_URL__;
    }

    # AGPL section 4 and OFL 1.1: the licence texts for what this server hands to browsers.
    location /licenses/ {
      root      /usr/share/nginx/html;
      autoindex on;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}
