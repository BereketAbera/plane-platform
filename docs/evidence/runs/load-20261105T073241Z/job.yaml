apiVersion: batch/v1
kind: Job
metadata:
  name: k6-20261105t073241z
  namespace: plane-dev
  labels:
    app.kubernetes.io/name: k6
spec:
  backoffLimit: 0 # a retry would double the load and the work items
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345 # the image's own user
        runAsGroup: 12345
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: script
          configMap: { name: k6-script }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
      containers:
        - name: k6
          image: docker.io/grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
          imagePullPolicy: IfNotPresent
          args: [run, --quiet, --no-color, /scripts/plane.js]
          env:
            - { name: BASE_URL, value: "http://traefik.traefik.svc.cluster.local" }
            - { name: PLANE_HOST, value: "plane.dev.localhost" }
            - { name: RUN_ID, value: "20261105t073241z" }
            - { name: THINK, value: "1" }
            - { name: K6_NO_USAGE_REPORT, value: "true" } # no route out, and it would only delay the exit
            - { name: PLANE_EMAIL, valueFrom: { secretKeyRef: { name: k6-auth, key: PLANE_EMAIL } } }
            - { name: PLANE_PASSWORD, valueFrom: { secretKeyRef: { name: k6-auth, key: PLANE_PASSWORD } } }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: script, mountPath: /scripts, readOnly: true }
            - { name: tmp, mountPath: /tmp }
