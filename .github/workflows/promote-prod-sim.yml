# Opens a pull request copying digests dev has already recorded into prod-sim. It never builds.
#
# A person merging that pull request is the approval. GitHub cannot enforce that on the Free plan
# with a private repository: no environment reviewers, no protected branches. See README.md.
name: promote-prod-sim

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to promote, such as web or backend. Leave empty to copy every image from dev.
        required: false
        type: string
      digest:
        description: Digest to promote, sha256:... Must already be recorded for dev. Needed with image.
        required: false
        type: string

permissions: {}

concurrency:
  group: promote-prod-sim
  cancel-in-progress: false

jobs:
  open-pull-request:
    name: Open promotion pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push the branch behind the pull request
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The refusal of a digest never recorded for dev reads the overlay's whole history.
          fetch-depth: 0
          persist-credentials: false
      - name: Edit and re-render the prod-sim overlay
        id: promote
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          # The workflow cannot reach the cluster. make gitops-publish checks plane-dev and takes the
          # backup after the merge.
          SKIP_BACKUP: "yes"
          CONFIRM: "yes"
          COMMIT: "no"
          SKIP_REGISTRY_CHECK: "yes"
        run: |
          ./scripts/install-tools.sh helm kustomize yq
          ./scripts/promote.sh prod-sim
          if [[ ! -f .build/promote-message.txt ]]; then
            echo 'prod-sim already runs these digests, so there is nothing to open.' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo 'message<<MESSAGE_END'
            cat .build/promote-message.txt
            echo 'MESSAGE_END'
            echo "title=$(head -n 1 .build/promote-message.txt)"
          } >>"$GITHUB_OUTPUT"
      # A pull request opened with GITHUB_TOKEN starts no job until someone approves its ci run, so check it here.
      - name: Validate the result
        if: steps.promote.outputs.title != ''
        env:
          SKIP_CHARTS: "yes"
        run: ./scripts/ci/validate-manifests.sh
      - name: Open the pull request
        id: open
        if: steps.promote.outputs.title != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: promote/prod-sim
          delete-branch: true
          add-paths: |
            helm/plane/overlays/prod-sim/kustomization.yaml
            gitops/environments/prod-sim/manifests.yaml
          commit-message: ${{ steps.promote.outputs.message }}
          title: ${{ steps.promote.outputs.title }}
          body: |
            Promotion to prod-sim, requested by @${{ github.actor }}. Every digest here was already recorded
            for dev, and `scripts/promote.sh` refused anything else. Nothing was rebuilt.

            **Merging this is the approval. GitHub cannot enforce it**: this repository is private on the Free
            plan, so there are no environment reviewers and no protected branches. Review it as the control it
            stands in for.

            After merging:

            1. `git pull`
            2. `make gitops-publish`, which first checks that plane-dev runs these digests and takes the prod-sim backup, because this workflow cannot reach the cluster
      # GitHub refuses the pull request after the branch is pushed, so a person can still finish the
      # promotion. The run stays red, because the pull request this workflow promises does not exist.
      - name: Explain a refused pull request
        if: failure() && steps.open.outcome == 'failure'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo '### Branch pushed, pull request not opened'
            echo
            echo 'If the step above says Actions is not permitted to create pull requests, the repository'
            echo 'setting is off: .github/workflows/README.md names it. A person can open this one by hand,'
            echo 'and ci.yml then runs on it, which it does not for a pull request opened with GITHUB_TOKEN:'
            echo
            echo "https://github.com/$REPOSITORY/compare/main...promote/prod-sim?expand=1"
          } >>"$GITHUB_STEP_SUMMARY"
