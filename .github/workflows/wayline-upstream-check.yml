# Weekly, and on demand: how far has upstream moved from the patch set? This only reports, and the summary is the
# result. Nothing is built or pushed. Runs the same script as `make wayline-upstream-check`.
name: wayline-upstream-check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream tag or branch
        default: preview

permissions: {}

jobs:
  check:
    name: Dry-run patches against upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/wayline/.node-version
      - name: Dry-run
        env:
          REF: ${{ inputs.ref || 'preview' }}
        run: |
          {
            echo '```'
            ./apps/wayline/checks/upstream-check.sh "$REF"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
