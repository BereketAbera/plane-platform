# Runs the same scripts as `make ci`. No secrets and no cluster, so a compromised tool has little
# to steal: every job holds a read-only token and persists no credentials. The one exception is
# release-plane-prod, last below, which runs only on main, after the others, and can move only the
# branch hosted production reads.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A newer push to a pull request replaces the older run. On main each pushed commit keeps its own
# run, because several can land within a minute and a cancelled run says nothing about its commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each pinned tool was checked against tools.lock when it was first fetched. GitHub's release downloads answered 504
      # for minutes at a time on 2026-11-05, and one such download fails a job before any check has run.
      - name: Restore pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.lock') }}
      - name: Shellcheck, actionlint, zizmor, terraform, tflint, hadolint, policy tests
        run: ./scripts/ci/lint.sh

  manifests:
    name: Manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The promotion invariant reads the history of the dev overlay.
          fetch-depth: 0
          persist-credentials: false
      # Each pinned tool was checked against tools.lock when it was first fetched. GitHub's release downloads answered 504
      # for minutes at a time on 2026-11-05, and one such download fails a job before any check has run.
      - name: Restore pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.lock') }}
      - name: Render drift, kubeconform, conftest, promotion invariant
        run: ./scripts/ci/validate-manifests.sh
      - name: One owner per resource
        run: ./scripts/ci/ownership.sh
      - name: Quotas fit the node, with Frameflow's share free
        run: ./scripts/ci/check-capacity.sh
      - name: The exact-digest promotion gate, with a throwaway key and repository
        run: ./scripts/ci/test-prod-gate.sh

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans all of history, not only this commit.
          fetch-depth: 0
          persist-credentials: false
      # Each pinned tool was checked against tools.lock when it was first fetched. GitHub's release downloads answered 504
      # for minutes at a time on 2026-11-05, and one such download fails a job before any check has run.
      - name: Restore pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.lock') }}
      - name: Gitleaks, trivy config, trivy fs
        run: ./scripts/ci/security.sh

  # What hosted Argo CD reads comes only from here, so CI holds no Kubernetes access and a merge that fails this reaches
  # nothing: the branch stays where it is, and production keeps running. Serial, because a newer commit replacing one still
  # waiting loses nothing, and an older one landing after it would be refused as a move backwards. No cache of tools, unlike
  # the jobs above, because this one can write, and what it fetches is checked against tools.lock.
  release-plane-prod:
    name: Release plane-prod
    needs: [lint, manifests, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # move deploy/plane-prod
      packages: read # read each digest's manifest and config on GHCR
    concurrency:
      group: release-plane-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The evidence names commits, and the refusal to move backwards reads ancestry.
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pinned yq
        run: ./scripts/install-tools.sh yq
      - name: Check the evidence, confirm each digest on GHCR, move deploy/plane-prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/publish-release.sh
