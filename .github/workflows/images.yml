# Pull request: build only. Push to main: build, walk, push to GHCR, record digests, scan and run what was pushed, and open
# a pull request bumping dev. Merging that pull request is left to a person. See README.md for what the ruleset on main
# enforces, and for how a GHCR digest reaches the local registry.
#
# Both paths run the same native build through scripts/ci/build-images.sh as `make images` does, with PLATFORM=linux/amd64
# on an x86-64 runner, because the VPS is x86-64. There is no emulation here. On the laptop `make images` stays linux/arm64,
# the script's default, and nothing changes there until a digest bump is merged. Every check after the build follows
# PLATFORM, so each reads the image production runs, and a manifest of another architecture fails it.
#
# checks/smoke-images.sh runs here natively, against the digests just published, and its failure stops the job, so no bump opens.
#
# Nothing here deletes a version in GHCR. The prune job kept the newest two, so it could have deleted a digest production
# runs or the evidence names. apps/wayline/scripts/prune-ghcr.sh says what it needs before it may run again.
#
# Earlier builds were arm64, on ubuntu-24.04-arm: runs 41975430939 and 42044273310 built, walked and pushed all four images
# and opened or updated pull request 1. Neither job has run yet as it stands here, on ubuntu-24.04. The build-only job has
# never run: no pull request has changed these paths yet.
#
# Publishing is gated on D12 (apps/wayline/backend/email-py-decision.txt, apps/wayline/MODIFICATIONS.md). The backend
# image replaces upstream's commercially headed email.py and is flattened, so no layer holds the original, and
# scripts/ci/build-images.sh walks every layer of each image in a throwaway registry on the runner before it publishes
# anything, then again as GHCR serves it. Images go only to the owner's GHCR namespace, and where publishing is not
# allowed this job fails. Pull requests store nothing to read, so that walk does not run on them.
name: images

on:
  pull_request:
    paths:
      - apps/wayline/**
      - "!apps/wayline/**/*.md"
      # Ships in every image, as /usr/share/licenses/wayline/MODIFICATIONS.txt, so a correction to it must rebuild them.
      - apps/wayline/MODIFICATIONS.md
      - LICENSE
      - COPYRIGHT.txt
      - NOTICE.md
      - scripts/ci/build-images.sh
      - scripts/lib/common.sh
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths:
      - apps/wayline/**
      - "!apps/wayline/**/*.md"
      # Ships in every image, as /usr/share/licenses/wayline/MODIFICATIONS.txt, so a correction to it must rebuild them.
      - apps/wayline/MODIFICATIONS.md
      - LICENSE
      - COPYRIGHT.txt
      - NOTICE.md
      - scripts/ci/build-images.sh
      - scripts/lib/common.sh
      - .github/workflows/images.yml

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build only
    if: github.event_name == 'pull_request'
    # Native x86-64, so no emulation. The target is the VPS.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # This runner was measured with about 14 GiB free. These two hold nothing a build uses.
      - name: Free disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Needs nothing but Python, and the walks are worth nothing if an image of another architecture can pass them.
      - name: Check the layer walk's own cases
        run: python3 -B apps/wayline/checks/layer-check-cases.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/wayline/.node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without pushing
        env:
          PLATFORM: linux/amd64
          MIN_FREE_DISK_GIB: "5"
          # This runner was measured at about 2 cores and 7 GiB. The defaults in build.sh suit the laptop.
          WAYLINE_TURBO_CONCURRENCY: "2"
          WAYLINE_HEAP_MB: "2560"
          PUSH: "no"
          OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/install-tools.sh yq
          ./scripts/ci/build-images.sh "ghcr.io/${OWNER,,}/wayline"

  publish:
    name: Build and push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Native x86-64, so no emulation. The target is the VPS.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # An x64 runner on this plan was measured at about 2 cores and 7 GiB, with about 14 GiB free. The default disk guard protects
    # the laptop's shared disk, and this disk is thrown away after the run. The build defaults would allow four tasks at 3 GiB
    # of heap each, more than this memory holds, so this allows two. A local build under these two values peaked at 1640 MiB
    # across its processes, on arm64: docs/evidence/branding/build-ci-settings.txt.
    env:
      PLATFORM: linux/amd64
      MIN_FREE_DISK_GIB: "5"
      WAYLINE_TURBO_CONCURRENCY: "2"
      WAYLINE_HEAP_MB: "2560"
    permissions:
      contents: read
      packages: write # push the built images to GHCR
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps:
      # This job took about 4 GiB of the arm64 runner's disk up to the scan, in run 42044273310. Trivy's database and every image the
      # smoke pulls come on top of that, and the guards stop at 5 GiB. These two hold nothing this job uses.
      - name: Free disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails the job where publishing is not allowed, before anything is built or any login is made.
      - name: Check this registry is allowed
        env:
          OWNER: ${{ github.repository_owner }}
        run: ./apps/wayline/scripts/publish-gate.sh "ghcr.io/${OWNER,,}/wayline"
      # Needs nothing but Python, and the walks below are worth nothing if an image of another architecture can pass them.
      - name: Check the layer walk's own cases
        run: python3 -B apps/wayline/checks/layer-check-cases.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/wayline/.node-version
      # The builder runs in a container, and pushes first to scripts/ci/build-images.sh's throwaway registry on loopback.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, walk every layer, publish, walk again, record digests
        id: build
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/install-tools.sh yq
          ./scripts/ci/build-images.sh "ghcr.io/${OWNER,,}/wayline"
          {
            echo 'digests<<DIGESTS_END'
            cat .build/digests.tsv
            echo 'DIGESTS_END'
          } >>"$GITHUB_OUTPUT"
          {
            echo '### Digests recorded'
            echo '```'
            cat .build/digests.tsv
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      # A failure here fails this job, so no bump opens for these digests.
      - name: Scan what was just pushed
        env:
          SCAN_ONLY: built
          SCAN_MIN_FREE_GIB: "5"
        run: ./scripts/ci/scan-images.sh
      # Pulls each digest from .build/digests.tsv as GHCR serves it, with this job's login, and runs it on this x86-64 runner.
      # A failure here fails this job too. The images stay in GHCR, and no bump opens for them.
      - name: Run what was just pushed, by digest
        env:
          WAYLINE_EXPECT_REF: ${{ github.sha }}
        run: ./apps/wayline/checks/smoke-images.sh

  bump-dev:
    name: Open digest bump for dev
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push the branch behind the pull request
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Edit and re-render the dev overlay
        id: promote
        env:
          DIGESTS: ${{ needs.publish.outputs.digests }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/install-tools.sh helm kustomize yq
          mkdir -p .build
          printf '%s\n' "$DIGESTS" >.build/digests.tsv
          # Argo CD pulls from the local registry in pass 1, so the overlay keeps naming it. The digest
          # is what travels, and scripts/ci/copy-to-local-registry.sh puts it there after the merge.
          sed -i "s|\tghcr.io/${OWNER,,}/wayline/|\tlocalhost:5001/wayline/|" .build/digests.tsv
          COMMIT=no SKIP_REGISTRY_CHECK=yes ./scripts/promote.sh dev
          {
            echo 'message<<MESSAGE_END'
            cat .build/promote-message.txt
            echo 'MESSAGE_END'
            echo "title=$(head -n 1 .build/promote-message.txt)"
          } >>"$GITHUB_OUTPUT"
      # A pull request opened with GITHUB_TOKEN does not trigger on: pull_request, so check it here.
      - name: Validate the result
        env:
          SKIP_CHARTS: "yes"
        run: ./scripts/ci/validate-manifests.sh
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bump/dev-images
          delete-branch: true
          add-paths: |
            helm/plane/overlays/dev/kustomization.yaml
            gitops/environments/dev/manifests.yaml
          commit-message: ${{ steps.promote.outputs.message }}
          title: ${{ steps.promote.outputs.title }}
          body: |
            Digest bump for dev, opened by `images.yml`. Merge it yourself: nothing merges this automatically.

            These are plain `linux/amd64` manifests, which is what production runs. Dev runs the same bytes under Rosetta.

            A person has to start CI: approve or re-run this pull request's held `ci` run, in the merge box or from
            Actions, wait for Lint, Manifests and Security, then merge with a merge commit.

            After merging:

            1. `git pull`
            2. `scripts/ci/copy-to-local-registry.sh ghcr.io/<owner>/wayline dev`
            3. `make gitops-publish`

            `smoke-images.sh` already ran these digests natively on x86-64 in this workflow. `validate-manifests.sh` ran
            too, because a pull request opened with `GITHUB_TOKEN` does not start CI on its own.
