# Pull request: build only. Push to main: build, push to GHCR, prune old versions, record digests,
# and open a pull request bumping dev. Merging that pull request is left to a person. See README.md
# for what this plan can and cannot enforce, and for how a GHCR digest reaches the local registry.
#
# Both paths run the same native build through scripts/ci/build-images.sh as `make images` does. Old versions are
# pruned as a precaution: GitHub's billing page says Container registry storage and bandwidth are currently free,
# and nothing has been stored there yet to confirm it. See apps/wayline/README.md.
#
# Not exercised yet. No run has contained apps/wayline. A pull request is what runs the build-only job for the
# first time. checks/smoke-images.sh is manual: it needs the images and is not run here.
#
# Publishing is gated on D12 (apps/wayline/backend/email-py-decision.txt, apps/wayline/MODIFICATIONS.md). The backend
# image replaces upstream's commercially headed email.py and is flattened, so no layer holds the original, and
# scripts/ci/build-images.sh walks every layer of each image in a throwaway registry on the runner before it publishes
# anything, then again as GHCR serves it. Images go only to the owner's GHCR namespace, and where publishing is not
# allowed this job fails. Pull requests store nothing to read, so that walk does not run on them.
name: images

on:
  pull_request:
    paths:
      - apps/wayline/**
      - "!apps/wayline/**/*.md"
      # Ships in every image, as /usr/share/licenses/wayline/MODIFICATIONS.txt, so a correction to it must rebuild them.
      - apps/wayline/MODIFICATIONS.md
      - LICENSE
      - COPYRIGHT.txt
      - NOTICE.md
      - scripts/ci/build-images.sh
      - scripts/lib/common.sh
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths:
      - apps/wayline/**
      - "!apps/wayline/**/*.md"
      # Ships in every image, as /usr/share/licenses/wayline/MODIFICATIONS.txt, so a correction to it must rebuild them.
      - apps/wayline/MODIFICATIONS.md
      - LICENSE
      - COPYRIGHT.txt
      - NOTICE.md
      - scripts/ci/build-images.sh
      - scripts/lib/common.sh
      - .github/workflows/images.yml

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build only
    if: github.event_name == 'pull_request'
    # Native arm64, so no emulation. The target is an arm64 kind node.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/wayline/.node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without pushing
        env:
          MIN_FREE_DISK_GIB: "5"
          # This runner was measured at 2 cores and 7.7 GiB. The defaults in build.sh suit the laptop.
          WAYLINE_TURBO_CONCURRENCY: "2"
          WAYLINE_HEAP_MB: "2560"
          PUSH: "no"
          OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/install-tools.sh yq
          ./scripts/ci/build-images.sh "ghcr.io/${OWNER,,}/wayline"

  publish:
    name: Build and push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    # An arm runner was measured with 34 GiB free, 2 cores and 7.7 GiB of memory. The default disk guard protects the
    # laptop's shared disk, and this disk is thrown away after the run. The build defaults would allow four tasks
    # at 3 GiB of heap each, more than this memory holds, so this allows two. A local build under these two values
    # peaked below the heap limit: docs/evidence/branding/build-ci-settings.txt.
    env:
      MIN_FREE_DISK_GIB: "5"
      WAYLINE_TURBO_CONCURRENCY: "2"
      WAYLINE_HEAP_MB: "2560"
    permissions:
      contents: read
      packages: write # push the built images to GHCR
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails the job where publishing is not allowed, before anything is built or any login is made.
      - name: Check this registry is allowed
        env:
          OWNER: ${{ github.repository_owner }}
        run: ./apps/wayline/scripts/publish-gate.sh "ghcr.io/${OWNER,,}/wayline"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/wayline/.node-version
      # The builder runs in a container, and pushes first to scripts/ci/build-images.sh's throwaway registry on loopback.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, walk every layer, publish, walk again, record digests
        id: build
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/install-tools.sh yq
          ./scripts/ci/build-images.sh "ghcr.io/${OWNER,,}/wayline"
          {
            echo 'digests<<DIGESTS_END'
            cat .build/digests.tsv
            echo 'DIGESTS_END'
          } >>"$GITHUB_OUTPUT"
          {
            echo '### Digests recorded'
            echo '```'
            cat .build/digests.tsv
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      # A failure here fails this job, so nothing below prunes an old version or opens a bump for these digests.
      - name: Scan what was just pushed
        env:
          SCAN_ONLY: built
          SCAN_MIN_FREE_GIB: "5"
        run: ./scripts/ci/scan-images.sh

  # Its own job, so a prune failure cannot hold back the digest bump. Pruning with GITHUB_TOKEN is still untested.
  prune:
    name: Prune old image versions
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write # delete old versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: ./apps/wayline/scripts/prune-ghcr.sh "${OWNER}" 2

  bump-dev:
    name: Open digest bump for dev
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push the branch behind the pull request
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Edit and re-render the dev overlay
        id: promote
        env:
          DIGESTS: ${{ needs.publish.outputs.digests }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/install-tools.sh helm kustomize yq
          mkdir -p .build
          printf '%s\n' "$DIGESTS" >.build/digests.tsv
          # Argo CD pulls from the local registry in pass 1, so the overlay keeps naming it. The digest
          # is what travels, and scripts/ci/copy-to-local-registry.sh puts it there after the merge.
          sed -i "s|\tghcr.io/${OWNER,,}/wayline/|\tlocalhost:5001/wayline/|" .build/digests.tsv
          COMMIT=no SKIP_REGISTRY_CHECK=yes ./scripts/promote.sh dev
          {
            echo 'message<<MESSAGE_END'
            cat .build/promote-message.txt
            echo 'MESSAGE_END'
            echo "title=$(head -n 1 .build/promote-message.txt)"
          } >>"$GITHUB_OUTPUT"
      # A pull request opened with GITHUB_TOKEN does not trigger on: pull_request, so check it here.
      - name: Validate the result
        env:
          SKIP_CHARTS: "yes"
        run: ./scripts/ci/validate-manifests.sh
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bump/dev-images
          delete-branch: true
          add-paths: |
            helm/plane/overlays/dev/kustomization.yaml
            gitops/environments/dev/manifests.yaml
          commit-message: ${{ steps.promote.outputs.message }}
          title: ${{ steps.promote.outputs.title }}
          body: |
            Digest bump for dev, opened by `images.yml`. Merge it yourself: nothing merges this automatically.

            After merging:

            1. `git pull`
            2. `scripts/ci/copy-to-local-registry.sh ghcr.io/<owner>/wayline dev`
            3. `make gitops-publish`

            `validate-manifests.sh` already ran in this workflow, because a pull request opened with
            `GITHUB_TOKEN` does not start CI on its own.
