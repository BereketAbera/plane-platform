# Pull request: build only. Push to main: build, push to GHCR, prune old versions, record digests,
# and open a pull request bumping dev. Merging that pull request is left to a person. See README.md
# for what this plan can and cannot enforce, and for how a GHCR digest reaches the local registry.
#
# Both paths run the same native build through scripts/ci/build-images.sh as `make images` does. GHCR
# gives this private repository 500 MB, and one image set is close to that. See apps/wayline/README.md.
#
# Not exercised yet. No run has contained apps/wayline. A pull request is what runs the build-only job for the
# first time. checks/smoke-images.sh is manual: it needs the images and is not run here.
#
# Publishing is gated on D12 (apps/wayline/backend/email-py-decision.txt): the backend image carries a file headed
# LicenseRef-Plane-Commercial, so until the owner decides, this job stops short of GHCR and says so.
name: images

on:
  pull_request:
    paths:
      - apps/wayline/**
      - "!apps/wayline/**/*.md"
      - LICENSE
      - COPYRIGHT.txt
      - NOTICE.md
      - scripts/ci/build-images.sh
      - scripts/lib/common.sh
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths:
      - apps/wayline/**
      - "!apps/wayline/**/*.md"
      - LICENSE
      - COPYRIGHT.txt
      - NOTICE.md
      - scripts/ci/build-images.sh
      - scripts/lib/common.sh
      - .github/workflows/images.yml

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build only
    if: github.event_name == 'pull_request'
    # Native arm64, so no emulation. The target is an arm64 kind node.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/wayline/.node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without pushing
        env:
          MIN_FREE_DISK_GIB: "5"
          PUSH: "no"
          OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/install-tools.sh yq
          ./scripts/ci/build-images.sh "ghcr.io/${OWNER,,}/wayline"

  publish:
    name: Build and push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    # GitHub-hosted arm runners have little disk. The default guard suits the laptop, not this.
    env:
      MIN_FREE_DISK_GIB: "5"
    permissions:
      contents: read
      packages: write # push the built images to GHCR
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the owner has decided D12
        id: gate
        run: |
          if [[ "$(cat apps/wayline/backend/email-py-decision.txt)" == pending ]]; then
            echo "::warning title=Nothing published::D12 is undecided (apps/wayline/backend/email-py-decision.txt), so no image goes to GHCR"
            echo "allowed=no" >>"$GITHUB_OUTPUT"
          else
            echo "allowed=yes" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.allowed == 'yes'
        with:
          node-version-file: apps/wayline/.node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.gate.outputs.allowed == 'yes'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.gate.outputs.allowed == 'yes'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push, record digests
        id: build
        if: steps.gate.outputs.allowed == 'yes'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/install-tools.sh yq
          ./scripts/ci/build-images.sh "ghcr.io/${OWNER,,}/wayline"
          {
            echo 'digests<<DIGESTS_END'
            cat .build/digests.tsv
            echo 'DIGESTS_END'
          } >>"$GITHUB_OUTPUT"
          {
            echo '### Digests recorded'
            echo '```'
            cat .build/digests.tsv
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # Its own job, so a prune failure cannot hold back the digest bump. Pruning with GITHUB_TOKEN is still untested.
  prune:
    name: Prune old image versions
    needs: publish
    if: needs.publish.outputs.digests != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      packages: write # delete old versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: ./apps/wayline/scripts/prune-ghcr.sh "${OWNER}" 2

  bump-dev:
    name: Open digest bump for dev
    needs: publish
    if: needs.publish.outputs.digests != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push the branch behind the pull request
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Edit and re-render the dev overlay
        id: promote
        env:
          DIGESTS: ${{ needs.publish.outputs.digests }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/install-tools.sh helm kustomize yq
          mkdir -p .build
          printf '%s\n' "$DIGESTS" >.build/digests.tsv
          # Argo CD pulls from the local registry in pass 1, so the overlay keeps naming it. The digest
          # is what travels, and scripts/ci/copy-to-local-registry.sh puts it there after the merge.
          sed -i "s|\tghcr.io/${OWNER,,}/wayline/|\tlocalhost:5001/wayline/|" .build/digests.tsv
          COMMIT=no SKIP_REGISTRY_CHECK=yes ./scripts/promote.sh dev
          {
            echo 'message<<MESSAGE_END'
            cat .build/promote-message.txt
            echo 'MESSAGE_END'
            echo "title=$(head -n 1 .build/promote-message.txt)"
          } >>"$GITHUB_OUTPUT"
      # A pull request opened with GITHUB_TOKEN does not trigger on: pull_request, so check it here.
      - name: Validate the result
        env:
          SKIP_CHARTS: "yes"
        run: ./scripts/ci/validate-manifests.sh
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bump/dev-images
          delete-branch: true
          add-paths: |
            helm/plane/overlays/dev/kustomization.yaml
            gitops/environments/dev/manifests.yaml
          commit-message: ${{ steps.promote.outputs.message }}
          title: ${{ steps.promote.outputs.title }}
          body: |
            Digest bump for dev, opened by `images.yml`. Merge it yourself: nothing merges this automatically.

            After merging:

            1. `git pull`
            2. `scripts/ci/copy-to-local-registry.sh ghcr.io/<owner>/wayline dev`
            3. `make gitops-publish`

            `validate-manifests.sh` already ran in this workflow, because a pull request opened with
            `GITHUB_TOKEN` does not start CI on its own.
