apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  name: plane-prod-predeploy-dump
  namespace: plane-prod
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backup
        app.kubernetes.io/name: plane-prod-predeploy-dump
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - |
          set -eu
          umask 077
          ROOT=/backups/predeploy
          KEEP=5
          RELEASE="$(printf '%.16s' "${BACKEND_IMAGE##*sha256:}")"
          mkdir -p "$ROOT"

          until pg_isready -q; do
            echo "waiting for Postgres"
            sleep 5
          done

          if ls -d "$ROOT"/*-"$RELEASE" >/dev/null 2>&1; then
            echo "backend $RELEASE already has its dump, so this is a retry or a sync with no new migrations"
            exit 0
          fi

          rm -rf "$ROOT"/*.partial
          D="$ROOT/$(date -u +%Y%m%dT%H%M%SZ)-$RELEASE"
          mkdir "$D.partial"

          # As scripts/backup.sh: these tables hold request and response bodies and grow fast, so only their schema
          # is kept. An empty database, as on first install, dumps to a small valid file.
          pg_dump -Fc -Z 6 \
            --exclude-table-data=api_activity_logs \
            --exclude-table-data=webhook_logs \
            --exclude-table-data=email_notification_logs \
            -f "$D.partial/plane.dump" "$POSTGRES_DB"
          pg_restore -l "$D.partial/plane.dump" >"$D.partial/plane.toc.txt"
          TABLES="$(psql -Atc "select count(*) from information_schema.tables where table_schema = 'public'" "$POSTGRES_DB")"
          printf '{"backend_image":"%s","tables":%s}\n' "$BACKEND_IMAGE" "$TABLES" >"$D.partial/manifest.json"
          (cd "$D.partial" && sha256sum plane.dump plane.toc.txt manifest.json >SHA256SUMS)
          mv "$D.partial" "$D"
          echo "dumped $TABLES tables to predeploy/${D##*/}"

          ls -1d "$ROOT"/*Z-* | sort -r | tail -n +"$((KEEP + 1))" | while read -r OLD; do rm -rf "$OLD"; done
        command:
        - /bin/sh
        - -c
        env:
        - name: PGHOST
          value: plane-pgdb
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: plane-pgdb
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: plane-pgdb
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: POSTGRES_DB
              name: plane-pgdb
        - name: BACKEND_IMAGE
          value: ghcr.io/bereketabera/wayline/backend@sha256:9df47b8afbd642288902044d0ec434e6c219a5f210be1b0cc9598f3d365fe8e2
        image: docker.io/library/postgres:15.19-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        imagePullPolicy: IfNotPresent
        name: dump
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /backups
          name: backups
      restartPolicy: Never
      securityContext:
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: plane
      volumes:
      - name: backups
        persistentVolumeClaim:
          claimName: backups
