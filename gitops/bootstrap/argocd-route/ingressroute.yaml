# Synced by the root Application (see ../chart/templates/root-application.yaml).
#
# Argo CD has a login, but no pod needs to reach it through Traefik either. The reasoning is in
# monitoring/manifests/shared/ingress-routes.yaml, and tests/routes/internal-routes.sh proves it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: node-network-only
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ipAllowList:
    sourceRange:
      - 172.16.0.0/12
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # One wave after traefik (-9), whose health check gates this one.
    argocd.argoproj.io/sync-wave: "-8"
    # The dry run at the start of the root sync happens before Traefik's CRD exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`argocd.localhost`)
      middlewares:
        - name: node-network-only
      services:
        - name: argocd-server
          port: 80
