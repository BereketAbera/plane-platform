# metrics-server 3.14.0 from https://kubernetes-sigs.github.io/metrics-server/.
# Release metrics-server, namespace kube-system.
image:
  repository: registry.k8s.io/metrics-server/metrics-server
  # The chart's default is 0.9.0. v0.9.1 is a security rebuild. The chart concatenates
  # repository:tag, so the digest travels in the tag.
  tag: v0.9.1@sha256:9b0ba1926e1d3089673f45461c3c1416109dea33b3ba3434048defd380df329b

# K3s signs the kubelet's serving certificate with its own CA, which this pod does not hold. The port is reached only by pods
# the policies allow and is dropped at the host firewall.
args:
  - --kubelet-insecure-tls

resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 128Mi
