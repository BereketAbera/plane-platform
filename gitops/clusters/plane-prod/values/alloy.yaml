# alloy 1.15.0 from https://grafana.github.io/helm-charts. Release name alloy, namespace monitoring.
# A Deployment reading logs through the Kubernetes API, not a DaemonSet tailing /var/log/pods:
# it needs no root, no hostPath and no privileged namespace. The cost is more kubelet traffic, which
# was small when measured locally on 53 log streams.
controller:
  type: deployment
  replicas: 1
  # One replica reading logs, so a restart costs nothing it will not re-read, and a surge would need quota for nothing.
  updateStrategy:
    type: Recreate
  volumes:
    extra:
      - name: storage
        emptyDir: { sizeLimit: 256Mi }

global:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 473 # the image has no USER and would otherwise run as root
    runAsGroup: 473
    fsGroup: 473
    seccompProfile: { type: RuntimeDefault }

image:
  registry: docker.io
  repository: grafana/alloy
  tag: v1.21.3-distroless
  digest: sha256:12ff3a82e402d34b450e7cb0555ff9703da645068dc321b2a98b9f1c110ab9e2

# Podlogs CRD and the reloader sidecar are both unused. With the reloader off the chart sets
# checksum/config on the pod template, so a config change still rolls out through Argo CD.
crds: { create: false }
configReloader: { enabled: false }

# The chart default grants cluster-wide read on every Secret and ConfigMap. Tailing logs needs
# only pods and their logs. clusterRules must stay non-empty: the template prints it after rules
# with toYaml, and an empty list renders as invalid YAML.
rbac:
  rules:
    - apiGroups: [""]
      resources: [pods, pods/log]
      verbs: [get, list, watch]
  clusterRules:
    - apiGroups: [""]
      resources: [namespaces]
      verbs: [get, list, watch]

serviceMonitor:
  enabled: true

alloy:
  enableReporting: false
  # Holds tail positions, on an emptyDir, so a new pod re-reads each container's log. Loki answers 400 for lines over an hour
  # behind their stream, and Alloy logs those as dropped. They were stored the first time round.
  storagePath: /var/lib/alloy
  mounts:
    extra:
      - name: storage
        mountPath: /var/lib/alloy
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
  livenessProbe:
    httpGet: { path: /-/healthy, port: 12345 }
    initialDelaySeconds: 30
    periodSeconds: 30
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  extraEnv:
    - { name: GOMEMLIMIT, value: 220MiB }
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Every namespace but K3s's own and the restore tests, whose pods work on a copy of live data and whose logs stay out of Loki for
        // that. A list to leave out and not one to keep, so a new app's logs arrive with no change here.
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "kube-system|kube-public|kube-node-lease|restore-test-.*"
          action        = "drop"
        }
        // Finished pods have nothing left to tail, and each dead target would retry forever.
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Succeeded|Failed"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pods.receiver]
      }

      // No stage.cri: the API returns plain lines, and that stage only applies to log files.
      loki.process "pods" {
        // Alertmanager logs a failed send to Telegram with its URL, and the bot's token is in that URL, unredacted. Loki would keep
        // it for 168 hours. scripts/ci/validate-manifests.sh tries this on such a line, and make remote-test asks Loki for any left.
        stage.replace {
          expression = "bot([0-9]+:[A-Za-z0-9_-]+)"
          replace    = "<redacted>"
        }
        // Blackbox probes the API every 15s. Without this those access lines would outnumber real
        // requests in the Logs dashboard.
        stage.drop {
          expression          = ".*Blackbox-Exporter.*"
          drop_counter_reason = "probe_noise"
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
