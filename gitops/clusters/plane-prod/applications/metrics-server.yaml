# kube-system because the platform has no namespace for it and this is where the chart documents it. K3s's own copy is disabled
# in its config, so this is the only one. repoURL carries the trailing slash because AppProject platform lists it that way.
# Finalizer kept: nothing here is irreplaceable, so removing this file from Git cleanly removes the app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targetRevision: 3.14.0
      helm:
        valueFiles:
          - $values/gitops/clusters/plane-prod/values/metrics-server.yaml
    - repoURL: ssh://git@ssh.github.com:443/BereketAbera/plane-platform.git
      targetRevision: deploy/plane-prod
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    # Finite retries would strand this app on first boot: automated sync never reattempts a failed
    # commit. refresh makes a retry pick up the newest commit, so a revert still lands while this
    # loops. Without it the retry stays pinned to the bad revision.
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
