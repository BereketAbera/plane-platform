# Installed by Terraform and read from no branch, so nothing Git delivers can widen these. Every template here stays valid
# YAML, with no range or if, so that linters reading gitops/** can parse it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: "{{ .Release.Namespace }}"
spec:
  description: Platform services. The only project allowed cluster-scoped resources and NetworkPolicies.
  sourceRepos:
    - "{{ .Values.gitRepoURL }}"
    - https://traefik.github.io/charts
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    # An OCI chart repository. Argo CD names these with no scheme, and treats a URL with no scheme as OCI.
    - quay.io/jetstack/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  # Terraform owns these, so a chart that renders one fails loudly at sync.
  clusterResourceBlacklist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: plane-prod
  namespace: "{{ .Release.Namespace }}"
spec:
  description: Plane production. Namespaced workloads and Infisical CRs in plane-prod only.
  sourceRepos:
    - "{{ .Values.gitRepoURL }}"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: plane-prod
  # clusterResourceWhitelist is deliberately absent: cluster scope is allow-list, so nothing passes.
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
---
# Each other app has a project like plane-prod's, so what its Application syncs stays in its own namespace, and cannot touch the
# platform's policies, quotas or cluster-scoped objects.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: frameflow
  namespace: "{{ .Release.Namespace }}"
spec:
  description: Frameflow. Namespaced workloads and Infisical CRs in frameflow only.
  sourceRepos:
    - "{{ .Values.gitRepoURL }}"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: frameflow
  # clusterResourceWhitelist is deliberately absent: cluster scope is allow-list, so nothing passes.
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
---
