# Nightly backup of Plane: the bodies of scripts/backup.sh's Job, on a schedule, sealed with restic.
#
# Differences from that Job, and why:
# - It runs with no laptop, so nothing can be read live or passed in. Images are pinned here. Postgres must stay the server's
#   own version, or pg_dump refuses, and the failure alerts.
# - Plaintext stays in an emptyDir, which goes with the pod. What stays on the host is restic's repository, encrypted, with
#   retention by restic.
# - /backups/predeploy is where the Sync hook writes a dump, plain, because restic's image cannot be in Plane's render: every image
#   there must be one dev ran. So this seals what it finds there, under tag predeploy, and empties the folder. A plain dump lasts one
#   night, or until make remote-backup runs, and a night that fails to seal it fails as a whole, so PlaneBackupFailed says so. Sealed
#   ones go after 90 days.
# - pg_dump -Z 0, because restic compresses, and an already compressed dump would defeat its deduplication. Unmeasured.
# - The bucket is listed once, first, and the copy, its check and lsjson keep to that listing, where that Job lists the bucket for
#   each. People upload at any hour, and an upload between that Job's copy and its check reads as an object the copy missed, which
#   here would fail the night and page.
#
# Until the first promotion Plane is not here, so its Secrets are optional and the run says so and succeeds. Once a repository
# exists, the same absence is a failure, so a Plane that has gone missing cannot read as a quiet success.
#
# ignore-healthcheck: Argo CD reads a CronJob whose last run failed as Degraded, which would make Application backup Degraded and fail
# root's sync at its first wave until a later night succeeds, and root could add or change no Application meanwhile. BackupTooOld and
# PlaneBackupFailed report a failed run instead.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plane-backup
  namespace: plane-prod
  labels:
    app.kubernetes.io/name: plane-backup
    app.kubernetes.io/component: backup
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  schedule: "17 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  # A node that was down at 02:17 still runs tonight's when it returns.
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: plane-backup
        app.kubernetes.io/component: backup
    spec:
      backoffLimit: 0 # never retry into a half-written folder
      activeDeadlineSeconds: 14400
      # A failed Job's metric is what PlaneBackupFailed reads. Long enough to outlast the next night, and no longer.
      ttlSecondsAfterFinished: 129600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: plane-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # One UID for every container: the folders on the host belong to it, and hostPath ignores fsGroup.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: {type: RuntimeDefault}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: backups}
            - name: restic-password
              secret: {secretName: restic-password, defaultMode: 0440}
            # Fills up, and the pod is evicted, and the failure alerts. Better than filling the node: this is a full copy of
            # the objects each night until a measurement says otherwise.
            - name: work
              emptyDir: {sizeLimit: 30Gi}
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
          initContainers:
            - name: postgres
              image: docker.io/library/postgres:15.19-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
              imagePullPolicy: IfNotPresent
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              env:
                - {name: PGHOST, value: plane-pgdb}
                - {name: PGUSER, valueFrom: {secretKeyRef: {name: plane-pgdb, key: POSTGRES_USER, optional: true}}}
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: plane-pgdb, key: POSTGRES_PASSWORD, optional: true}}}
                - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: plane-pgdb, key: POSTGRES_DB, optional: true}}}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: "1", memory: 256Mi}
              volumeMounts:
                - {name: backups, mountPath: /backups, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  umask 077
                  BACKUP_ID="$(date -u +%Y%m%dT%H%M%SZ)"
                  printf '%s' "$BACKUP_ID" > /work/backup-id
                  D=/work/backup
                  TAB="$(printf '\t')"

                  # kube-router admits a new pod a second or two after it starts, and until then refuses its connections just as a
                  # closed port does: three pods on this node were refused at once and answered at 1 to 2 s. So an early refusal says
                  # nothing, and without this wait the first backup here read one as Plane not being deployed. A minute, for a slow Postgres too.
                  TRIES=0
                  until [ -z "${PGPASSWORD:-}" ] || pg_isready -q -t 10 || [ "$TRIES" -ge 30 ]; do
                    TRIES=$((TRIES + 1))
                    sleep 2
                  done

                  if [ -z "${PGPASSWORD:-}" ] || ! pg_isready -q -t 10; then
                    if [ -e /backups/restic/config ]; then
                      echo "postgres: Plane is not answering here, and a repository says it was. Refusing to read that as nothing to do." >&2
                      exit 1
                    fi
                    echo "postgres: Plane has not been deployed here yet and no backup exists, so there is nothing to back up"
                    : > /work/skip
                    exit 0
                  fi
                  mkdir "$D" "$D/postgres"

                  # A run killed before its trap below leaves its scratch copy in the live server, a full plaintext copy with nothing
                  # to remove it. Only this Job makes them, one at a time, so any found here is left over.
                  psql -XAt -d "$POSTGRES_DB" -c "SELECT datname FROM pg_database WHERE datname LIKE 'scratch\_%'" | while read -r OLD; do
                    echo "postgres: dropping $OLD, which an earlier run left"
                    dropdb --if-exists --force "$OLD" || echo "postgres: could not drop $OLD" >&2
                  done

                  # These tables hold request and response bodies and grow fast under API-key traffic.
                  # Their schema is kept; their rows are not worth restoring.
                  pg_dump -Fc -Z 0 \
                    --exclude-table-data=api_activity_logs \
                    --exclude-table-data=webhook_logs \
                    --exclude-table-data=email_notification_logs \
                    -f "$D/postgres/plane.dump" "$POSTGRES_DB"
                  pg_restore -l "$D/postgres/plane.dump" > "$D/postgres/plane.toc.txt"

                  # The queries ship with the dump, so a restore checks itself with exactly these.
                  cat > "$D/postgres/rowcounts.sql" <<'SQL'
                  SELECT string_agg(format('SELECT %L AS t, count(*) AS c FROM public.%I', tablename, tablename), ' UNION ALL ' ORDER BY tablename) AS q FROM pg_tables WHERE schemaname = 'public' \gset
                  SELECT * FROM (:q) s ORDER BY t;
                  SQL
                  cat > "$D/postgres/content.sql" <<'SQL'
                  SELECT 'issues', md5(coalesce(string_agg(id::text || ':' || coalesce(name, ''), ',' ORDER BY id), '')) FROM issues
                  UNION ALL SELECT 'projects', md5(coalesce(string_agg(id::text || ':' || coalesce(name, ''), ',' ORDER BY id), '')) FROM projects
                  UNION ALL SELECT 'file_assets', md5(coalesce(string_agg(id::text || ':' || coalesce(asset, ''), ',' ORDER BY id), '')) FROM file_assets;
                  SQL

                  # Prove the dump restores, and count from it rather than from a moving live database.
                  V="scratch_$(printf '%s' "$BACKUP_ID" | tr '[:upper:]' '[:lower:]')"
                  trap 'dropdb --if-exists --force "$V" || true' EXIT
                  createdb "$V"
                  pg_restore --no-owner --no-privileges --exit-on-error --single-transaction -d "$V" "$D/postgres/plane.dump"
                  psql -XAt -F "$TAB" -v ON_ERROR_STOP=1 -d "$V" -f "$D/postgres/rowcounts.sql" > "$D/postgres/rowcounts.tsv"
                  psql -XAt -F "$TAB" -v ON_ERROR_STOP=1 -d "$V" -f "$D/postgres/content.sql" > "$D/postgres/content.tsv"
                  psql -XAt -d "$POSTGRES_DB" -c 'SHOW server_version' > "$D/postgres/server_version.txt"
                  pg_dump --version > "$D/postgres/pg_dump_version.txt"
                  # No live read of the running image is possible here, so the database says what version last migrated it.
                  psql -XAt -d "$POSTGRES_DB" -c 'SELECT current_version FROM instances LIMIT 1' > "$D/postgres/plane_version.txt" 2>/dev/null || : > "$D/postgres/plane_version.txt"
                  echo "postgres: $(wc -l < "$D/postgres/rowcounts.tsv") tables counted from a scratch restore"
                  # For the comparison below, from the same query as a restore's GATE2, on what this dump holds. If the
                  # query fails on a later schema, this backup records no result: better that than no backup.
                  if psql -XAt -v ON_ERROR_STOP=1 -d "$V" \
                    -c "SELECT asset FROM file_assets WHERE is_uploaded AND NOT is_deleted AND deleted_at IS NULL" \
                    > "$D/postgres/uploaded-keys.unsorted"; then
                    LC_ALL=C sort "$D/postgres/uploaded-keys.unsorted" > "$D/postgres/uploaded-keys.txt"
                  else
                    echo "postgres: could not list the uploaded assets, so this backup records no result for them" >&2
                  fi
                  rm -f "$D/postgres/uploaded-keys.unsorted"
            # After the dump, so every asset row has its object. Extra objects are harmless.
            - name: objects
              image: docker.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
              imagePullPolicy: IfNotPresent
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              env:
                - {name: HOME, value: /tmp}
                - {name: RCLONE_CONFIG, value: /tmp/rclone.conf}
                - {name: RCLONE_CONFIG_SRC_TYPE, value: s3}
                - {name: RCLONE_CONFIG_SRC_PROVIDER, value: Minio}
                - {name: RCLONE_CONFIG_SRC_ENDPOINT, valueFrom: {secretKeyRef: {name: plane-doc-store, key: AWS_S3_ENDPOINT_URL, optional: true}}}
                - {name: RCLONE_CONFIG_SRC_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: plane-doc-store, key: AWS_ACCESS_KEY_ID, optional: true}}}
                - {name: RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: plane-doc-store, key: AWS_SECRET_ACCESS_KEY, optional: true}}}
                - {name: BUCKET, valueFrom: {secretKeyRef: {name: plane-doc-store, key: AWS_S3_BUCKET_NAME, optional: true}}}
              resources:
                requests: {cpu: 25m, memory: 32Mi}
                limits: {cpu: 500m, memory: 192Mi}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  umask 077
                  if [ -f /work/skip ]; then exit 0; fi
                  D=/work/backup
                  mkdir -p "$D/objects"
                  # One listing, taken first, which the copy and the check both keep to. People upload at any hour, and a check that
                  # listed the bucket again would find what came after the copy and fail the night on it. An object deleted after the
                  # listing is not there to copy or to compare, and one deleted while the check reads it reads as an error there. So
                  # the check's own verdict is not the one kept: every listed object still in the bucket afterwards must have checked
                  # equal, byte for byte, and only those gone from it may be missing.
                  rclone lsf -R --files-only "src:$BUCKET" > "$D/objects.listed"
                  rclone copy "src:$BUCKET" "$D/objects" --files-from-raw "$D/objects.listed" --checksum --transfers 4 --stats 0
                  # Plane's presigned GET serves Content-Type as stored, which the copy keeps only in lsjson, so restore replays it.
                  # lsjson reads only the objects the copy holds, so the replay meets none the copy lacks. It reads them after the copy
                  # and before the check, so an object the check finds equal to its copy was that object when lsjson read it. One
                  # deleted between the copy and lsjson is in the copy with no entry, and a restore puts it back with the type rclone
                  # guesses from its name.
                  rclone lsf -R --files-only "$D/objects" > "$D/.objects.held"
                  rclone lsjson -R --metadata --files-from-raw "$D/.objects.held" "src:$BUCKET" > "$D/objects.lsjson"
                  rclone check "src:$BUCKET" "$D/objects" --files-from-raw "$D/objects.listed" --one-way --download --combined "$D/objects.check" || :
                  # Not piped: a listing that failed must fail the run, and not read as every object gone.
                  rclone lsf -R --files-only --files-from-raw "$D/objects.listed" "src:$BUCKET" > "$D/.objects.still"
                  LC_ALL=C sort "$D/.objects.still" > "$D/.objects.still.sorted"
                  sed -n 's/^= //p' "$D/objects.check" | LC_ALL=C sort > "$D/.objects.equal"
                  LC_ALL=C comm -23 "$D/.objects.still.sorted" "$D/.objects.equal" > "$D/.objects.unequal"
                  if [ -s "$D/.objects.unequal" ]; then
                    echo "objects: listed objects still in the bucket that did not check equal to their copies: $(wc -l < "$D/.objects.unequal"). The first of them:" >&2
                    head -n 5 "$D/.objects.unequal" >&2
                    exit 1
                  fi
                  LISTED=$(($(wc -l < "$D/objects.listed")))
                  EQUAL=$(($(wc -l < "$D/.objects.equal")))
                  echo "objects: $EQUAL checked, of $LISTED listed, and $((LISTED - EQUAL)) gone from the bucket before their check"
                  rm -f "$D/.objects.held" "$D/.objects.still" "$D/.objects.still.sorted" "$D/.objects.equal" "$D/.objects.unequal"
                  # GATE2 begin. A restore's GATE2, made here on what a restore would have: the rows in this dump and the
                  # objects in this backup. It stays a record and not a failure, because a backup with one dangling row
                  # still holds everything else, and is better than none. The manifest carries the count for a plan. If
                  # the comparison itself cannot run, this backup records no result, and that does not cost the backup.
                  if [ -f "$D/postgres/uploaded-keys.txt" ]; then
                    if rclone lsf -R --files-only "$D/objects" > "$D/.objects.list" \
                      && LC_ALL=C sort "$D/.objects.list" > "$D/.objects.sorted" \
                      && LC_ALL=C comm -23 "$D/postgres/uploaded-keys.txt" "$D/.objects.sorted" > "$D/.objects.missing"; then
                      mv "$D/.objects.missing" "$D/postgres/uploaded-missing.txt"
                      echo "GATE2: $(wc -l < "$D/postgres/uploaded-keys.txt") rows marked uploaded, $(wc -l < "$D/postgres/uploaded-missing.txt") with no object in this backup"
                    else
                      echo "objects: could not compare the uploaded rows with the objects, so this backup records no result for them" >&2
                    fi
                    rm -f "$D/.objects.list" "$D/.objects.sorted" "$D/.objects.missing"
                  fi
                  # GATE2 end
            - name: manifest
              image: docker.io/library/postgres:15.19-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
              imagePullPolicy: IfNotPresent
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              env:
                - {name: SECRET_KEY, valueFrom: {secretKeyRef: {name: plane-app-keys, key: SECRET_KEY, optional: true}}}
              resources:
                requests: {cpu: 25m, memory: 32Mi}
                limits: {cpu: 200m, memory: 64Mi}
              volumeMounts:
                - {name: work, mountPath: /work}
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  umask 077
                  if [ -f /work/skip ]; then exit 0; fi
                  BACKUP_ID="$(cat /work/backup-id)"
                  cd /work/backup
                  # A truncated hash of a high-entropy key is safe beside the dump. The key is not.
                  FP="$(printf %s "$SECRET_KEY" | sha256sum | cut -c1-16)"
                  unset SECRET_KEY
                  entry() { printf '{"path":"%s","bytes":%s,"sha256":"%s"}' "$1" "$(wc -c < "$1" | tr -d ' ')" "$(sha256sum "$1" | cut -d' ' -f1)"; }
                  FILES=""
                  for f in postgres/plane.dump postgres/plane.toc.txt postgres/rowcounts.tsv postgres/content.tsv objects.lsjson; do
                    FILES="$FILES${FILES:+,}$(entry "$f")"
                  done
                  OBJECTS="$(find objects -type f | wc -l | tr -d ' ')"
                  OBJECT_BYTES="$(find objects -type f -exec stat -c %s {} + | awk '{s += $1} END {print s + 0}')"
                  if [ -f postgres/uploaded-missing.txt ]; then
                    UPLOADED="{\"rows\": $(wc -l < postgres/uploaded-keys.txt | tr -d ' '), \"missing\": $(wc -l < postgres/uploaded-missing.txt | tr -d ' ')}"
                  else
                    UPLOADED=null
                  fi
                  cat > manifest.json <<JSON
                  {
                    "schema": 1,
                    "kind": "plane",
                    "env": "prod",
                    "id": "$BACKUP_ID",
                    "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "plane_version": "$(cat postgres/plane_version.txt)",
                    "pg_server_version": "$(cat postgres/server_version.txt)",
                    "pg_dump_version": "$(cat postgres/pg_dump_version.txt)",
                    "secret_key_fp": "$FP",
                    "excluded_table_data": ["api_activity_logs", "webhook_logs", "email_notification_logs"],
                    "objects": {"count": $OBJECTS, "bytes": $OBJECT_BYTES},
                    "uploaded_objects": $UPLOADED,
                    "files": [$FILES]
                  }
                  JSON
                  find . -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum > SHA256SUMS
                  sha256sum -c SHA256SUMS > /dev/null
                  echo "manifest: $BACKUP_ID complete"
          containers:
            - name: seal
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              env:
                - {name: RESTIC_REPOSITORY, value: /backups/restic}
                - {name: RESTIC_PASSWORD_FILE, value: /run/restic/password}
                - {name: RESTIC_CACHE_DIR, value: /work/cache}
                - {name: TMPDIR, value: /work/tmp}
                - {name: HOME, value: /tmp}
                - {name: BACKUP_HOST, value: plane-prod}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: "1", memory: 1Gi}
              volumeMounts:
                - {name: backups, mountPath: /backups}
                - {name: restic-password, mountPath: /run/restic, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  # Not 077: new folders in the repository must stay enterable by the read-only pull user's group. restic sets
                  # its files' modes itself, read-only, from the group bits of the repository's config.
                  umask 027
                  PREDEPLOY=/backups/predeploy
                  if [ -f /work/skip ] && ! ls "$PREDEPLOY"/*/plane.dump > /dev/null 2>&1; then
                    echo "seal: nothing to seal"
                    exit 0
                  fi
                  mkdir -p /work/tmp /work/cache
                  rc=0
                  restic cat config > /dev/null 2>&1 || rc=$?
                  case "$rc" in
                    0) ;;
                    10) restic init ;;
                    *)
                      echo "seal: cannot read the repository at $RESTIC_REPOSITORY, restic exit $rc" >&2
                      exit 1
                      ;;
                  esac
                  # Group read on config is restic's hint to create everything after it group-readable.
                  chmod -R g+rX "$RESTIC_REPOSITORY"
                  # What the Sync hook left. Its folder stays, empty, because its name is how the hook knows this image has its dump. A
                  # .partial is its Job's for no longer than that Job's deadline, so an old one is from a Job that died.
                  if [ -d "$PREDEPLOY" ]; then
                    find "$PREDEPLOY" -maxdepth 1 -type d -name '*.partial' -mmin +120 -exec rm -rf {} +
                    for DUMP in "$PREDEPLOY"/*Z-*; do
                      case "$DUMP" in *.partial) continue ;; esac
                      [ -f "$DUMP/plane.dump" ] || continue
                      restic backup --retry-lock 10m --host "$BACKUP_HOST" --tag predeploy "$DUMP"
                      rm -rf "${DUMP:?}"/*
                      echo "seal: ${DUMP##*/} is in restic, tag predeploy, and gone from this disk"
                    done
                  fi
                  if [ -f /work/skip ]; then
                    echo "seal: nothing else to seal"
                    exit 0
                  fi
                  # A fixed path and --group-by, so retention groups these and the next run finds its parent.
                  restic backup --retry-lock 10m --host "$BACKUP_HOST" --tag wayline --group-by host,tags /work/backup
                  # A dump from before a migration goes by age, as far back as the monthlies below reach. --keep-within counts back from
                  # the newest snapshot of the group, and with no tag filter that is tonight's, so the last dump cannot stay for ever
                  # because no promotion came after it. --keep-tag leaves the nightlies to the next line.
                  restic forget --retry-lock 10m --host "$BACKUP_HOST" --group-by host --keep-tag wayline --keep-within 90d
                  restic forget --retry-lock 10m --host "$BACKUP_HOST" --tag wayline --group-by host,tags \
                    --keep-daily 7 --keep-weekly 4 --keep-monthly 3 --prune
                  restic check --retry-lock 10m --read-data-subset=5%
                  # Sunday: a quarter of the data, so a month reads all of it.
                  if [ "$(date -u +%u)" = 7 ]; then
                    restic check --retry-lock 10m --read-data-subset="$(date -u +%U | awk '{print ($1 % 4) + 1}')/4"
                  fi
                  chmod -R g+rX "$RESTIC_REPOSITORY"
                  restic snapshots --host "$BACKUP_HOST" --tag wayline --latest 1 --compact
                  echo "seal: complete"
