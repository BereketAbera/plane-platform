apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: canonical
  namespace: snakebrawl
spec:
  redirectRegex:
    regex: '^https://www\.snakebrawl\.io(.*)'
    replacement: 'https://snakebrawl.io${1}'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: prelaunch-page, namespace: snakebrawl }
spec:
  replacePath: { path: /prelaunch.html }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: prelaunch-status, namespace: snakebrawl }
spec:
  replacePath: { path: /prelaunch.json }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: snakebrawl
  namespace: snakebrawl
  # Switch the public landing page only after the web pod serves the prelaunch assets.
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  entryPoints: [websecure]
  tls: { secretName: snakebrawl-tls }
  routes:
    - kind: Rule
      match: Host(`snakebrawl.io`)
      middlewares: [{ name: prelaunch-page }]
      services: [{ name: snakebrawl-web, port: 3100 }]
    - kind: Rule
      match: Host(`www.snakebrawl.io`)
      middlewares: [{ name: canonical }]
      services: [{ name: snakebrawl-web, port: 3100 }]
    - kind: Rule
      match: >-
        Host(`snakebrawl.io`) &&
        (PathRegexp(`^/(how-to-play|privacy|terms|support)/?$`) ||
        Path(`/robots.txt`) || Path(`/sitemap.xml`) || Path(`/icon.svg`) || Path(`/social-preview`) ||
        PathPrefix(`/_next/static/`) || Path(`/_next/image`) || PathPrefix(`/lobby/`))
      services: [{ name: snakebrawl-web, port: 3100 }]
    - kind: Rule
      match: Host(`ws.snakebrawl.io`) && (Path(`/health`) || Path(`/`))
      middlewares: [{ name: prelaunch-status }]
      services: [{ name: snakebrawl-web, port: 3100 }]
