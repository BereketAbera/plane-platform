apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: canonical
  namespace: snakebrawl
spec:
  redirectRegex:
    regex: '^https://www\.snakebrawl\.io(.*)'
    replacement: 'https://snakebrawl.io${1}'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: snakebrawl
  namespace: snakebrawl
spec:
  entryPoints: [websecure]
  tls: { secretName: snakebrawl-tls }
  routes:
    - kind: Rule
      match: Host(`snakebrawl.io`)
      services: [{ name: snakebrawl-web, port: 3100 }]
    - kind: Rule
      match: Host(`www.snakebrawl.io`)
      middlewares: [{ name: canonical }]
      services: [{ name: snakebrawl-web, port: 3100 }]
    - kind: Rule
      match: >-
        Host(`ws.snakebrawl.io`) &&
        (Path(`/health`) || Path(`/parties`) || Path(`/matchmake/joinOrCreate/garden`) ||
        PathRegexp(`^/parties/[A-Za-z0-9]{6}$`) || PathRegexp(`^/matchmake/reconnect/[A-Za-z0-9_-]+$`) ||
        (HeaderRegexp(`Upgrade`,`(?i)^websocket$`) && PathRegexp(`^/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$`)))
      services: [{ name: snakebrawl-arena, port: 2567 }]
