apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: snakebrawl
  name: game
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snakebrawl-web
  namespace: snakebrawl
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: snakebrawl-web }
  template:
    metadata:
      annotations: { snakebrawl.io/telemetry-mode: gameplay }
      labels:
        app.kubernetes.io/name: snakebrawl-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: snakebrawl
    spec:
      serviceAccountName: game
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: docker.io/library/snake-production-web@sha256:db4178a76d03c7bdd5125074d5184830162c51388208617f82b4ce342a267c8d
          imagePullPolicy: Never
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          ports:
            - { name: http, containerPort: 3100 }
          resources:
            requests: { cpu: 200m, memory: 192Mi }
            limits: { cpu: '1', memory: 512Mi }
          env:
            - { name: NODE_OPTIONS, value: '--max-old-space-size=288' }
            - { name: SENTRY_RELEASE, value: '1.0.2' }
          envFrom:
            - secretRef: { name: snakebrawl-web-telemetry, optional: true }
          readinessProbe: { httpGet: { path: /prelaunch.json, port: http }, periodSeconds: 5, timeoutSeconds: 4 }
          livenessProbe: { httpGet: { path: '/', port: http }, periodSeconds: 20, timeoutSeconds: 4 }
          volumeMounts:
            - { name: prelaunch, mountPath: /arena/apps/web/public/prelaunch.html, subPath: prelaunch.html, readOnly: true }
            - { name: prelaunch, mountPath: /arena/apps/web/public/prelaunch.json, subPath: prelaunch.json, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /arena/apps/web/.next/cache }
      volumes:
        - { name: prelaunch, configMap: { name: snakebrawl-prelaunch-v1 } }
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
        - { name: cache, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snakebrawl-arena
  namespace: snakebrawl
spec:
  # A room and its reconnect reservations belong to exactly one process.
  # One measured process owns all live rooms and enforces the global guest cap.
  replicas: 1
  revisionHistoryLimit: 2
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: snakebrawl-arena }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snakebrawl-arena
        app.kubernetes.io/component: arena
        app.kubernetes.io/part-of: snakebrawl
    spec:
      serviceAccountName: game
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: arena
          # V8 GC flags are CLI arguments. NODE_OPTIONS accepts the heap limit.
          command: [node, '--v8-pool-size=1', '--single-threaded-gc', '--max-semi-space-size=32', /arena/build/server/index.mjs]
          image: docker.io/library/snake-production-arena@sha256:8109bd6f05bc6c56158ac15dba77650665141ee0de125b3ca05b64151e7fab79
          imagePullPolicy: Never
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          ports:
            - { name: game, containerPort: 2567 }
            - { name: metrics, containerPort: 9464 }
          resources:
            requests: { cpu: '4', memory: 2Gi }
            limits: { cpu: '4', memory: 2Gi }
          env:
            - { name: NODE_OPTIONS, value: '--max-old-space-size=1200' }
            - { name: ARENA_ALLOWED_ORIGINS, value: 'https://snakebrawl.io' }
            - { name: ARENA_PUBLIC_ADDRESS, value: ws.snakebrawl.io }
            - { name: TRUST_PROXY_IP, value: 'true' }
            - { name: ARENA_INSTANCE, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: SENTRY_RELEASE, value: '1.0.5' }
            - { name: NEXT_PUBLIC_GAME_VERSION, value: '1.0.5' }
            - { name: MAX_SNAKES, value: '25' }
            - { name: MAX_CONNECTED_GUESTS, value: '100' }
            - { name: MAX_PUBLIC_ROOMS, value: '5' }
            - { name: SNAPSHOT_SPREAD_AFTER, value: '3' }
            - { name: MAX_SPECTATORS, value: '12' }
            - { name: BOT_TARGET, value: '2' }
            - { name: MAX_PARTIES, value: '1' }
            - { name: PARTY_CAPACITY, value: '4' }
            - { name: METRICS_ENABLED, value: 'true' }
            - { name: METRICS_HOST, value: '0.0.0.0' }
            - { name: ARENA_RSS_BUDGET_MIB, value: '2048' }
          envFrom:
            - secretRef: { name: snakebrawl-arena-telemetry, optional: true }
          readinessProbe: { httpGet: { path: /health, port: game }, periodSeconds: 5, timeoutSeconds: 2 }
          livenessProbe: { httpGet: { path: /health, port: game }, periodSeconds: 20, timeoutSeconds: 4 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
