# The account the site's pod runs as. The image is a private package on GHCR, so this names the pull Secret, which
# scripts/hosted/pull-secrets.sh makes from the owner's token because a Secret cannot be committed. No token: nginx never calls the API
# server. Ahead of the Deployment, because a pod is refused until its account exists, and takes the pull Secret from it when it is made.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: rillmark
  labels:
    app.kubernetes.io/name: rillmark-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: rillmark
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull
