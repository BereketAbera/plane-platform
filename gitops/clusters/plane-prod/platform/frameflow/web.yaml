# What the route sends to. The route names this port, 3000, and policy/hosted.rego holds it to the web pods and their port, so it cannot
# be pointed at Silo's or the API's.
apiVersion: v1
kind: Service
metadata:
  name: frameflow-web
  labels:
    app.kubernetes.io/name: frameflow-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: frameflow
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Frameflow's web server: Next.js, standalone, which serves the pages and proxies /api/* and /streams/* to frameflow-api:4000, the address
# its image was built with. Every page renders in the browser, so the server holds no secret and reads no setting but its address and its
# port. Until the API runs, the pages load and their calls to it fail.
#
# One replica. A rollout starts the new pod and waits for it to be ready before the old one goes, so a deploy is no outage, and the quota
# has room for that second pod. The root filesystem is read-only, and the server writes only its cache and /tmp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frameflow-web
  labels:
    app.kubernetes.io/name: frameflow-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: frameflow
  annotations:
    # After the services the API needs, as the API and the worker are in release B, and before the route, so its first answer is not
    # Traefik's 503.
    argocd.argoproj.io/sync-wave: "3"
    # It reads no Secret today, so this does nothing until one is added, and then rolls it as it rolls the others.
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frameflow-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frameflow-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: frameflow
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      securityContext:
        # UID and GID 1000 are node in the image, which its Dockerfile runs as by number.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/bereketabera/frameflow/web:83f693d81006@sha256:1eec65ef87141b25d3f3a4436619564d5ed3dee5936c42ae65421325572cfb6a
          # The image sets both, and these are here because the container runtime sets HOSTNAME to the pod's name over the image's, and
          # Next.js would then listen on that name's address alone.
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          # The landing page, which is built into the image and calls nothing to render, so these say the server is up. Whether the
          # site is, through Traefik and its certificate, is the Probe's to say, in monitoring-extras/frameflow.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          # Traefik can still send a request for a moment after the pod is told to stop, so the server keeps serving for 5s. Plane's routed
          # Deployments do the same, which took their rollouts from 502s to no failed request (helm/plane/components/hardening).
          # The sleep action needs no shell or binary in the image.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Starting values, not yet measured on this node.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
