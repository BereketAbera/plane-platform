# The accounts Frameflow's pods run as, one to a workload, and the one its Infisical operator logs in as. None has a token: no pod here
# calls the API server, and iso-frameflow, which does, runs as its own chart's account. Ahead of everything else, because a pod is
# refused until its account exists, and takes the pull Secret from it when it is made.
#
# Frameflow's own images, web and backend, are private packages on GHCR, so the accounts that run them name ghcr-pull, which
# infisical.yaml makes from GHCR_PULL_TOKEN. Hatchet's, Silo's, mc's and Postgres's images are public, so their accounts name no pull
# Secret, and those pods start whether or not that one exists.
#
# plane-infisical-auth is used by no pod. iso-frameflow mints short-lived tokens for it to log in to Infisical as frameflow-prod's reader,
# and it holds system:auth-delegator through platform/infisical/token-reviewer.yaml, so a workload must never run as it. The name is the one
# infisical/terraform's Kubernetes auth allows.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plane-infisical-auth
  labels:
    app.kubernetes.io/name: frameflow-secrets
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: frameflow
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels:
    app.kubernetes.io/name: frameflow-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: frameflow
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/name: frameflow-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: frameflow
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: frameflow-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: frameflow
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull
---
