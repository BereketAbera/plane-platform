# Scoped to metrics-server alone. kube-system holds K3s's own CoreDNS and storage provisioner, which this platform does not own, so it
# gets no namespace default-deny.
#
# The API server aggregates this pod on 10250, and the pod scrapes the kubelet on 10250 and watches the API on 6443, all at the
# node's address. See traefik.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: metrics-server } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 5.253.234.127/32 }
      ports:
        - { protocol: TCP, port: 10250 }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 5.253.234.127/32 }
      ports:
        - { protocol: TCP, port: 6443 }
        - { protocol: TCP, port: 10250 }
