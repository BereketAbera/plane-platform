# What watches Awushi Cloudgarden's public route from its own namespace, so the operator gives its Probe's metrics namespace
# awushi-cloudgarden, and the served certificate's alert tells this one from Plane's and Grafana's.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: awushi-cloudgarden
resources:
  - probes.yaml
