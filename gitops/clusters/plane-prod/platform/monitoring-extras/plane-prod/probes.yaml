# Probes go to the public host over TLS. Inside the cluster CoreDNS rewrites that name to Traefik's Service, so they exercise the
# same certificate and routes as a browser, and they do not leave the node, so they say nothing about the firewall or DNS. The
# operator sets the namespace label from where each Probe lives. Two API probes every 15s is 8 requests a minute from one IP, under
# Plane's anonymous limit of 30 a minute; do not probe these two faster than about every 5s combined.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: plane-api-instance
spec:
  jobName: plane-http
  interval: 15s
  scrapeTimeout: 10s
  module: http_plane_instance
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://wayline.bereket.dev/api/instances/
      labels: { probe: api-instance, env: prod }
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: plane-api-db
spec:
  jobName: plane-http
  interval: 15s
  scrapeTimeout: 10s
  module: http_plane_db
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://wayline.bereket.dev/api/public/anchor/__probe__/settings/
      labels: { probe: api-db, env: prod }
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: plane-live
spec:
  jobName: plane-http
  interval: 15s
  scrapeTimeout: 10s
  module: http_live
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://wayline.bereket.dev/live/health
      labels: { probe: live, env: prod }
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: plane-frontend
spec:
  jobName: plane-http
  interval: 15s
  scrapeTimeout: 10s
  module: http_html
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://wayline.bereket.dev/
        - https://wayline.bereket.dev/god-mode/
        - https://wayline.bereket.dev/spaces/
      labels: { probe: frontend, env: prod }
