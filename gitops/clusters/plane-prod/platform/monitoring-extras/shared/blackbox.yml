# Body assertions are mandatory. With no endpoints Traefik can fall through to the catch-all web
# route, which answers 200 with HTML, so a status-only probe would pass while the API is gone.
#
# Every target is https://wayline.bereket.dev, https://grafana.bereket.dev or https://infisical.bereket.dev. Inside the cluster CoreDNS
# rewrites those names to Traefik's Service, so a probe crosses the same TLS, certificate and routes as a browser, without leaving the node.
# The certificate is verified, so a staging certificate or a failed renewal reads as a failed probe. SNI and Host come from the target.
modules:
  http_html:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ['(?i)<!doctype html']
  # /api/instances/ is cached for 2h in Valkey, so this one does not prove Postgres is up.
  http_plane_instance:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [200]
      fail_if_body_json_not_matches_cel: "has(body.config) && has(body.instance)"
  # This route does hit Postgres and answers 404 for an unknown anchor, which is the healthy case.
  http_plane_db:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [404]
      fail_if_body_not_matches_regexp: ['does not exist']
  http_live:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [200]
      fail_if_body_json_not_matches_cel: "body.status == 'OK'"
  # Grafana's own page, by its title, so another service behind that route reads as down.
  http_grafana_login:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ['<title>Grafana</title>']
  # Infisical's own page, by its title, as Grafana's: every page there is the same index.html, so another service would not carry it.
  http_infisical_login:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ['<title id="initial-document-title">Infisical</title>']
  # What a stranger reads at the public route: claimed, and closed to sign-up. probe_failed_due_to_cel reads 1 only when Infisical answered
  # 200 and its body says otherwise, which with the pinned blackbox includes a field gone or a body that is not JSON. A 404 or no answer
  # leaves it at 0, so InfisicalOpenToClaim is never a route that is down.
  http_infisical_claimed:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [200]
      fail_if_body_json_not_matches_cel: "body.config.initialized == true && body.config.allowSignUp == false"
  # One call under each of the route's two limits, which Infisical refuses through its error handler with no account read. Each body names
  # that error, so a route whose Middleware is missing, which gets Traefik's 404 in plain text, reads as down. Not the MFA router's paths:
  # in v0.167.6 its hook answers a call with no bearer token in a body that does not match the route's own 401 schema, so the server
  # answers 500 instead.
  #
  # A password set with no session, which verifyAuth refuses 401 before the body is read.
  http_infisical_no_bearer_post:
    prober: http
    timeout: 5s
    http:
      method: POST
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [401]
      fail_if_body_not_matches_regexp: ['"message":\s*"Token missing"']
  # A token refresh with no refresh cookie, which answers 404 AuthTokenNotFound, the healthy case. A path Infisical has no route for gets
  # error "Not Found" instead.
  http_infisical_no_refresh_cookie:
    prober: http
    timeout: 5s
    http:
      method: POST
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [404]
      fail_if_body_not_matches_regexp: ['"error":\s*"AuthTokenNotFound"']
  # A connection that must not succeed: see the denied-prometheus Probe.
  tcp_denied:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
