# These live here, so the Traefik, Argo CD and cert-manager values must enable only the metrics Services:
#   traefik:      metrics.prometheus.service.enabled=true
#   argocd:       controller.metrics.enabled=true
#   cert-manager: prometheus.enabled=true
# Leave the charts' own serviceMonitor.enabled false, or the targets are scraped twice.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
spec:
  namespaceSelector:
    matchNames: [traefik]
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      interval: 30s
      # Traefik's own "service" label names the backend, which every dashboard groups by. Without
      # this it collides with the target label and becomes exported_service.
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-application-controller
spec:
  namespaceSelector:
    matchNames: [argocd]
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
      app.kubernetes.io/component: application-controller
  endpoints:
    - port: http-metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
spec:
  namespaceSelector:
    matchNames: [cert-manager]
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  endpoints:
    - port: http-metrics
      interval: 60s
      # A certificate's own namespace is the one its alerts should name, not the controller's.
      honorLabels: true
