# What this cluster needs and the local one cannot have: a real disk, a public certificate, nightly backups, a reboot to take, and a
# policy engine to doubt. tests/rules/hosted.test.yaml holds each rule to its numbers.
#
# A rule that reads a metric nobody produces is silent for good, so each group that depends on one also alerts on its absence.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hosted
spec:
  groups:
    - name: hosted.state
      interval: 30s
      rules:
        # 1 once the first promotion has added the Application, and nothing before. It holds through a controller restart, because an
        # alert gated on this must not resolve just because Argo CD's metrics stopped for a moment.
        - record: wayline:plane_application:present
          expr: max(max_over_time(argocd_app_info{name="plane-prod"}[15m]))
    # One filesystem holds the system, K3s's images, every volume and the backups, and local-path enforces no PVC size, so this is
    # the only thing that bounds them. The kubelet starts evicting at 10% free (infrastructure/hosted/plane-prod/kubelet.conf).
    - name: hosted.disk
      interval: 30s
      rules:
        - alert: NodeDiskLow
          expr: |
            node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.20
          for: 10m
          labels: { severity: warning, component: node }
          annotations:
            summary: The node's disk has {{ $value | humanizePercentage }} free
        - alert: NodeDiskCritical
          expr: |
            node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
          for: 5m
          labels: { severity: critical, component: node }
          annotations:
            summary: The node's disk has {{ $value | humanizePercentage }} free, and at 10% the kubelet evicts pods
        - alert: NodeDiskNotRead
          expr: absent(node_filesystem_avail_bytes{mountpoint="/"})
          for: 15m
          labels: { severity: warning, component: node }
          annotations:
            summary: Nothing reports the root filesystem, so the disk alerts cannot fire
    # cert-manager renews at two thirds of the lifetime, so a 90 day certificate has 30 days left at renewal and this means renewal has
    # been failing for over a week. Let's Encrypt moves to 64 days in February 2027, when renewal comes at 21 days and this
    # leaves no margin, and to 45 days in February 2028, when it would always fire. Lower it before each.
    - name: hosted.certificates
      interval: 30s
      rules:
        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 21 * 86400
          labels: { severity: warning, component: certificate }
          annotations:
            summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}, so renewal is failing
        # An issue in progress reads False, hence for:. A failed order reads False too, until a try an hour or more away. Opening the
        # firewall does not bring that closer: scripts/hosted/README.md says what does.
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 30m
          labels: { severity: critical, component: certificate }
          annotations:
            summary: Certificate {{ $labels.namespace }}/{{ $labels.name }} has not been Ready for 30m
        # What a browser gets, not what cert-manager thinks it issued. A Secret Traefik failed to reload shows only here. By namespace,
        # where each Probe lives: plane-prod's are Wayline's, monitoring's is Grafana's and infisical's is Infisical's. So a new app's Probe
        # is covered by being there.
        - alert: ServedCertificateExpiringSoon
          expr: min by (namespace) (probe_ssl_earliest_cert_expiry) - time() < 14 * 86400
          labels: { severity: critical, component: certificate }
          annotations:
            summary: The certificate served for {{ $labels.namespace }} expires in {{ $value | humanizeDuration }}
        - alert: CertificateNotWatched
          expr: |
            absent(certmanager_certificate_ready_status{name="wayline-tls"})
              or absent(certmanager_certificate_ready_status{name="grafana-tls"})
              or absent(certmanager_certificate_ready_status{name="infisical-tls"})
          for: 30m
          labels: { severity: warning, component: certificate }
          annotations:
            summary: cert-manager reports nothing for {{ $labels.name }}, so the certificate alerts cannot fire
    # One of the two consoles on the internet. It is not what users need, so a warning, with time for a certificate's first order and a restart.
    - name: hosted.grafana
      interval: 30s
      rules:
        - alert: GrafanaRouteDown
          expr: probe_success{probe="grafana"} == 0
          for: 5m
          labels: { severity: warning, component: grafana }
          annotations:
            summary: https://grafana.bereket.dev has failed its probe for 5m. The console is still reachable with make remote-ui
        - alert: GrafanaRouteNotWatched
          expr: absent(probe_success{probe="grafana"})
          for: 15m
          labels: { severity: warning, component: grafana }
          annotations:
            summary: The probe of https://grafana.bereket.dev is not running, so GrafanaRouteDown cannot fire
    # The other console on the internet, and the one that holds every secret. Down is a warning, as Grafana's is: the operator reads it
    # through its Service, so Plane does not notice. Open is not: anyone who signs up, or claims an instance with no admin, owns it. The
    # probe reads 1 for a 200 whose body is not that config too, which is no less reason to look.
    - name: hosted.infisical
      interval: 30s
      rules:
        # Its page, and one path under each of the route's two limits: a limit's Middleware gone turns sign-in or token refresh into
        # Traefik's 404, and only its own probe sees that.
        - alert: InfisicalRouteDown
          expr: probe_success{probe=~"infisical|infisical-sign-in|infisical-session"} == 0
          for: 5m
          labels: { severity: warning, component: infisical }
          annotations:
            summary: "{{ $labels.instance }} has failed its probe for 5m. Infisical is still reachable with make remote-ui, and the operator does not use this route"
        - alert: InfisicalRouteNotWatched
          expr: |
            absent(probe_success{probe="infisical"})
              or absent(probe_success{probe="infisical-sign-in"})
              or absent(probe_success{probe="infisical-session"})
          for: 15m
          labels: { severity: warning, component: infisical }
          annotations:
            summary: The probe {{ $labels.probe }} of https://infisical.bereket.dev is not running, so InfisicalRouteDown cannot fire for it
        # At once, as NetworkPolicyNotEnforced: the body was read and says it, so this is never a flake. scripts/hosted/README.md, section
        # Infisical reads open, says what to do.
        - alert: InfisicalOpenToClaim
          expr: probe_failed_due_to_cel{probe="infisical-claimed"} == 1
          labels: { severity: critical, component: infisical }
          annotations:
            summary: https://infisical.bereket.dev/api/v1/admin/config does not read claimed and closed to sign-up, so whoever signs up or claims it first may own every production secret
        - alert: InfisicalClaimNotRead
          expr: probe_success{probe="infisical-claimed"} == 0 and probe_failed_due_to_cel{probe="infisical-claimed"} == 0
          for: 10m
          labels: { severity: warning, component: infisical }
          annotations:
            summary: The config at https://infisical.bereket.dev/api/v1/admin/config has not answered for 10m, so InfisicalOpenToClaim cannot fire
        # With another module on the Probe, probe_success reads 0 and there is no probe_failed_due_to_cel at all, so the two rules above
        # stay quiet. Only a module that reads the body with CEL gives that series, so its absence counts as not watched too.
        - alert: InfisicalClaimNotWatched
          expr: |
            absent(probe_success{probe="infisical-claimed"})
              or absent(probe_failed_due_to_cel{probe="infisical-claimed"})
          for: 15m
          labels: { severity: warning, component: infisical }
          annotations:
            summary: The probe of Infisical's sign-up and admin is not running, or does not read the config's body, so InfisicalOpenToClaim cannot fire
    # The metric appears only after a first success, so absent also covers a CronJob that has never worked, and for: gives the first
    # nightly run time to happen. PlaneBackupFailed sees only a Job that ran and failed, and misses one that never runs.
    - name: hosted.backups
      interval: 30s
      rules:
        - alert: BackupTooOld
          expr: time() - kube_cronjob_status_last_successful_time{namespace=~"plane-prod|infisical",cronjob="plane-backup"} > 26 * 3600
          labels: { severity: critical, component: backup }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.cronjob }} last succeeded {{ $value | humanizeDuration }} ago"
        # Before the first promotion Plane's CronJob succeeds with nothing to dump, so this clock needs no gate.
        - alert: BackupNeverSucceeded
          expr: absent(kube_cronjob_status_last_successful_time{namespace="plane-prod",cronjob="plane-backup"})
          for: 26h
          labels: { severity: critical, component: backup, namespace: plane-prod }
          annotations:
            summary: No backup in plane-prod has succeeded, or its CronJob is gone
        - alert: BackupNeverSucceeded
          expr: absent(kube_cronjob_status_last_successful_time{namespace="infisical",cronjob="plane-backup"})
          for: 26h
          labels: { severity: critical, component: backup, namespace: infisical }
          annotations:
            summary: No backup in infisical has succeeded, or its CronJob is gone
    - name: hosted.network
      interval: 30s
      rules:
        # blackbox-exporter connected to a port its policy refuses. See shared/probes.yaml. Everything else about this cluster's
        # isolation rests on what this checks, so it is critical at once: a success is never a flake.
        - alert: NetworkPolicyNotEnforced
          expr: probe_success{probe="denied-prometheus"} == 1
          labels: { severity: critical, component: network }
          annotations:
            summary: A connection every NetworkPolicy forbids just succeeded, so NetworkPolicies are not being enforced
        - alert: NetworkPolicyNotTested
          expr: absent(probe_success{probe="denied-prometheus"})
          for: 15m
          labels: { severity: warning, component: network }
          annotations:
            summary: The denied-connection probe is not running, so NetworkPolicyNotEnforced cannot fire
    # Unattended upgrades install but do not reboot, by choice. A timer on the node writes this into node-exporter's textfile directory.
    - name: hosted.node
      interval: 30s
      rules:
        - alert: NodeRebootRequired
          expr: node_reboot_required == 1
          for: 1h
          labels: { severity: warning, component: node }
          annotations:
            summary: An upgrade on the node needs a reboot, and nothing here will do it unasked
        - alert: NodeRebootNotWatched
          expr: absent(node_reboot_required)
          for: 1h
          labels: { severity: warning, component: node }
          annotations:
            summary: Nothing reports whether the node needs a reboot, so NodeRebootRequired cannot fire
        - alert: PublicFirewallNotLoaded
          expr: wayline_edge_table_loaded == 0
          for: 10m
          labels: { severity: critical, component: node }
          annotations:
            summary: The public firewall's table is not loaded, so the API and kubelet ports answer on the public address
