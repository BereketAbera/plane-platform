# What a browser and a stranger get at Infisical's public route: the same TLS, certificate and route, without leaving the node, because
# CoreDNS rewrites this name to Traefik's Service too. The first two read paths under no limit of the route's. The last two read one path
# under each limit, twice a minute, which leaves blackbox's own address well inside both. policy/hosted.rego holds each Probe and its
# blackbox module to these words, because the alerts in shared/rules-hosted.yaml read them.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: infisical
spec:
  jobName: infisical-http
  interval: 30s
  scrapeTimeout: 10s
  module: http_infisical_login
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://infisical.bereket.dev/login
      labels: { probe: infisical }
---
# Sign-up closed and an admin claimed, as the anonymous config a sign-in page reads says, through the route a stranger would use. Sign-up
# closes in the database, at the bootstrap call, and nothing but that call and a super admin's setting moves it.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: infisical-claimed
spec:
  jobName: infisical-http
  interval: 30s
  scrapeTimeout: 10s
  module: http_infisical_claimed
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://infisical.bereket.dev/api/v1/admin/config
      labels: { probe: infisical-claimed }
---
# The route's sign-in part, under its limit of guesses: a password set with no session, which Infisical refuses 401 "Token missing" before
# the body or any account is read. Not one of the two-factor paths beside it: in v0.167.6 the MFA router answers a call with no token from
# its own hook, in a body that does not match the route's own 401 schema, so the server answers 500. A missing infisical-guess-limit makes
# Traefik answer every sign-in 404, and only this would say so.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: infisical-sign-in
spec:
  jobName: infisical-http
  interval: 30s
  scrapeTimeout: 10s
  module: http_infisical_no_bearer_post
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://infisical.bereket.dev/api/v1/password/password-setup
      labels: { probe: infisical-sign-in }
---
# The route's session part, under its wider limit: a token refresh with no refresh cookie, which Infisical answers 404 AuthTokenNotFound
# before any account is read. Its two-factor checks would answer 500 the same way. A missing infisical-session-limit breaks
# select-organization and token refresh, and only this would say so.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: infisical-session
spec:
  jobName: infisical-http
  interval: 30s
  scrapeTimeout: 10s
  module: http_infisical_no_refresh_cookie
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
    path: /probe
  targets:
    staticConfig:
      static:
        - https://infisical.bereket.dev/api/v1/auth/token
      labels: { probe: infisical-session }
