# The chart renders no ServiceAccount with serviceAccount.create=false and its pod template has no
# automount switch, so the setting lives here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-server
  namespace: infisical
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/part-of: infisical
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
