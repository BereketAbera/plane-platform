apiVersion: v1
kind: PersistentVolume
metadata:
  name: backups-dev
  labels: { plane-platform/backups: "dev" }
spec:
  capacity: { storage: 5Gi } # a label: hostPath enforces nothing, scripts/backup.sh checks host disk
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: { apiVersion: v1, kind: PersistentVolumeClaim, namespace: plane-dev, name: backups }
  hostPath: { path: /backups/dev, type: DirectoryOrCreate }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  namespace: plane-dev
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: backups-dev
  resources:
    requests: { storage: 5Gi }
