apiVersion: v1
kind: PersistentVolume
metadata:
  name: backups-infisical
  labels: { plane-platform/backups: "infisical" }
spec:
  capacity: { storage: 5Gi } # a label: hostPath enforces nothing, scripts/backup.sh checks host disk
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: { apiVersion: v1, kind: PersistentVolumeClaim, namespace: infisical, name: backups }
  hostPath: { path: /backups/infisical, type: DirectoryOrCreate }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  namespace: infisical
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: backups-infisical
  resources:
    requests: { storage: 5Gi }
