# monitoring. Prometheus is the only pod that crosses namespaces, and only to metrics ports. No pod
# here has internet egress, so Grafana's update and plugin checks have no route; its values turn them
# off as well.
#
# Prometheus scraping its own pod stays inside the pod's network namespace, so no rule is needed for it.
#
# ASSUMPTION: 172.16.0.0/12 holds the kind network. See traefik.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: monitoring
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports:
        - { protocol: TCP, port: 9090 }
  egress:
    # Service discovery on 6443, kubelet and cAdvisor on 10250, node-exporter on 9100. All are at the
    # node IP, since the kubelet is on the host and node-exporter is hostNetwork.
    - to:
        - ipBlock: { cidr: 172.16.0.0/12 }
      ports:
        - { protocol: TCP, port: 6443 }
        - { protocol: TCP, port: 10250 }
        - { protocol: TCP, port: 9100 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: alertmanager } }
      ports:
        - { protocol: TCP, port: 9093 }
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
      ports:
        - { protocol: TCP, port: 3000 }
    - to:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [kube-state-metrics, kube-prometheus-stack-prometheus-operator] }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: loki } }
      ports:
        - { protocol: TCP, port: 3100 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: alloy } }
      ports:
        - { protocol: TCP, port: 12345 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: blackbox-exporter } }
      ports:
        - { protocol: TCP, port: 9115 }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: TCP, port: 9153 }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports:
        - { protocol: TCP, port: 9100 }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: argocd } }
      ports:
        - { protocol: TCP, port: 8082 }
        - { protocol: TCP, port: 8083 }
        - { protocol: TCP, port: 8084 }
    # RabbitMQ's plugin, Silo, the two exporters and the Infisical operator's metrics. The Plane
    # namespaces' own policies decide which pod accepts which port.
    - to:
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: [plane-dev, plane-prod-sim] }
      ports:
        - { protocol: TCP, port: 15692 }
        - { protocol: TCP, port: 9000 }
        - { protocol: TCP, port: 9187 }
        - { protocol: TCP, port: 9121 }
        - { protocol: TCP, port: 8443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: alertmanager } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [prometheus, grafana] }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports:
        - { protocol: TCP, port: 9093 }
    # The config reloader's own metrics.
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: alert-sink } }
      ports:
        - { protocol: TCP, port: 8080 }
---
# The API egress is for the dashboard and datasource sidecars, which watch ConfigMaps.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: grafana } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports:
        - { protocol: TCP, port: 9090 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: alertmanager } }
      ports:
        - { protocol: TCP, port: 9093 }
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: loki } }
      ports:
        - { protocol: TCP, port: 3100 }
    - to:
        - ipBlock: { cidr: 172.16.0.0/12 }
      ports:
        - { protocol: TCP, port: 6443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-readers
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [kube-state-metrics, kube-prometheus-stack-prometheus-operator] }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - ipBlock: { cidr: 172.16.0.0/12 }
      ports:
        - { protocol: TCP, port: 6443 }
---
# The self rule covers Loki's memberlist and gRPC loopback through its own Services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki
  namespace: monitoring
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: loki } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [alloy, grafana, prometheus] }
      ports:
        - { protocol: TCP, port: 3100 }
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: loki } }
      ports:
        - { protocol: TCP, port: 3100 }
        - { protocol: TCP, port: 7946 }
        - { protocol: TCP, port: 9095 }
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: loki } }
      ports:
        - { protocol: TCP, port: 3100 }
        - { protocol: TCP, port: 7946 }
        - { protocol: TCP, port: 9095 }
---
# loki.source.kubernetes reads logs through the API server, so no kubelet or host path is involved.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy
  namespace: monitoring
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: alloy } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports:
        - { protocol: TCP, port: 12345 }
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: loki } }
      ports:
        - { protocol: TCP, port: 3100 }
    - to:
        - ipBlock: { cidr: 172.16.0.0/12 }
      ports:
        - { protocol: TCP, port: 6443 }
---
# Probes go through Traefik's pod port, so a failed probe means what a failed user request means.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: blackbox-exporter } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports:
        - { protocol: TCP, port: 9115 }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: alert-sink } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: alertmanager } }
      ports:
        - { protocol: TCP, port: 8080 }
