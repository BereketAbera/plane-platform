# Rules, dashboards, probes, exporters and the alert sink. monitoring/manifests holds a
# kustomization.yaml, which Argo CD detects. After the stack so its CRDs exist. Finalizer kept:
# nothing here is irreplaceable, so removing this file from Git cleanly removes the app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-extras
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: git://plane-git/plane-platform.git
    targetRevision: main
    path: monitoring/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    # Finite retries would strand this app on first boot: automated sync never reattempts a failed
    # commit. refresh makes a retry pick up the newest commit, so a revert still lands while this
    # loops. Without it the retry stays pinned to the bad revision.
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
