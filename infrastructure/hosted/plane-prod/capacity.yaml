# Who may use this VPS, in one place. Terraform reads quotas and limit_ranges from here and applies them, and scripts/ci/check-capacity.sh
# fails CI unless every quota's sum, with the system's share and the scratch space below that no quota counts, still fits the node.
#
# Quotas cap rather than reserve, so what keeps one namespace from taking another's room is that their caps add up to no more than the
# node. Every namespace is counted the same way, Frameflow's too, so a new app or a bigger quota is a pull request that has to find the
# room here.
#
# Sizes are starting values, from what the local cluster measured and estimates for what it does not run. Measure on the node and
# change them here.
node:
  # 12 vCPU, as Contabo sells it. Memory is what the OS reports (MemTotal), not the plan's 48 GB. Disk is the root filesystem as measured,
  # the kubelet's capacity of 405,196,772Ki, which is 386.4GiB. The 400 GB in Contabo's record is the block device under it.
  cpu: "12"
  memory: 47Gi
  disk: 386Gi
system:
  # kubeReserved + systemReserved in kubelet.conf, which check-capacity.sh compares. It covers K3s itself and the few pods K3s and metrics-server
  # keep in kube-system, which has no quota because this platform does not own it.
  cpu: 1500m
  # The same two, plus the memory the kubelet's eviction threshold keeps free.
  memory: 5Gi
  # The OS, K3s's data and every image.
  disk: 40Gi
# Space on the node's disk that a namespace's emptyDirs take beside its claims, which no quota counts, because none sets ephemeral-storage
# (see below), for each namespace that budgets it. Frameflow's is its worker's ephemeral-storage limit of 10Gi, which holds the 8Gi scratch
# an encode works in, and its nightly backup's 22Gi work space.
ephemeral:
  frameflow: 32Gi
# Per namespace: Terraform makes a ResourceQuota of each. limits.memory counts what every pod here may reach at once, plus the room
# one rollout needs: a Deployment surges a new pod before removing the old, so a quota with no room for the largest would stop that
# rollout for good. Several surging together go one after another, and that is the price of every quota fitting the one node. cert-manager's
# solver pod, beside each Certificate, counts as one more of these, and a renewal that meets a rollout waits for it in the same way.
#
# requests.cpu and requests.memory are also what the scheduler holds back, so they must fit. requests.storage caps claims,
# which local-path does not enforce. Only the disk alerts bound what a volume really holds, and no ephemeral-storage quota is set: a
# LimitRange default would evict the nightly backup, whose scratch space runs to 30Gi by design.
quotas:
  # 12624Mi steady, per the sizing table, and 2064Mi of room: the api's surge, or a backup or migrator with a smaller one.
  plane-prod:
    requests.cpu: 3300m
    requests.memory: 7Gi
    limits.memory: 14688Mi
    pods: "32"
    persistentvolumeclaims: "6"
    # Postgres 30, Valkey 2, RabbitMQ 4, Silo 64, and the backups PVC's 40.
    requests.storage: 140Gi
  # 1792Mi steady, and the server's surge or the Redis secret hook.
  argocd:
    requests.cpu: 250m
    requests.memory: 512Mi
    limits.memory: 1984Mi
    pods: "8"
    persistentvolumeclaims: "0"
    requests.storage: "0"
  # One pod. It cannot surge, because of its hostPorts, but the new pod is created while the old one is still terminating.
  traefik:
    requests.cpu: 100m
    requests.memory: 192Mi
    limits.memory: 512Mi
    pods: "3"
    persistentvolumeclaims: "0"
    requests.storage: "0"
  # 320Mi steady, and the controller's surge, or the startup check.
  cert-manager:
    requests.cpu: 50m
    requests.memory: 192Mi
    limits.memory: 448Mi
    pods: "6"
    persistentvolumeclaims: "0"
    requests.storage: "0"
  # 4128Mi steady, with Grafana and Alloy on Recreate, and the operator's surge, or grafana-tls's solver, which is smaller.
  monitoring:
    requests.cpu: 300m
    requests.memory: 1792Mi
    limits.memory: 4416Mi
    pods: "14"
    persistentvolumeclaims: "3"
    # Prometheus 16, Loki 10, Alertmanager 1.
    requests.storage: 27Gi
  monitoring-agents:
    requests.cpu: 20m
    requests.memory: 48Mi
    limits.memory: 128Mi
    pods: "2"
    persistentvolumeclaims: "0"
    requests.storage: "0"
  # 1376Mi steady, and either the server's surge or the nightly backup, or infisical-tls's solver, which is smaller. A surge fills this to the
  # last MiB, so a solver that meets one waits for it. That is at the first order and at every renewal, about
  # every 60 days. A solver stuck in its self-check holds its 64Mi meanwhile, and the next surge and backup pods are refused, which
  # ArgoAppDegraded, KubeJobFailed and BackupTooOld show. PlaneBackupFailed does not: it counts failed pods, and a pod the quota refuses is
  # never created. The first order would meet the rollout of the values that come with the route, so those go out first, on their own:
  # scripts/hosted/README.md, section The first certificate.
  infisical:
    requests.cpu: 300m
    requests.memory: 1664Mi
    limits.memory: 2400Mi
    pods: "6"
    persistentvolumeclaims: "3"
    # Postgres 2, Redis 1, and the backups PVC's 10.
    requests.storage: 13Gi
  # 64Mi steady, one nginx pod, and 192Mi of room: the two probe pods scripts/test-netpol.sh starts at once, and the web pod's surge or
  # rillmark-tls's solver, 64Mi each. Requests hold all five at once: 50m, and 128Mi of the 160Mi, 16Mi each and the solver's 64Mi.
  rillmark:
    requests.cpu: 50m
    requests.memory: 160Mi
    limits.memory: 256Mi
    pods: "5"
    persistentvolumeclaims: "0"
    requests.storage: "0"
  # The same pods as rillmark's, with devops-tls's solver.
  awushi-cloudgarden:
    requests.cpu: 50m
    requests.memory: 160Mi
    limits.memory: 256Mi
    pods: "5"
    persistentvolumeclaims: "0"
    requests.storage: "0"
  # 11392Mi steady, the limits its seven pods set: web and the api 512Mi each, the worker 6Gi, Hatchet and its Postgres 1536Mi each, Silo
  # 1Gi and the operator 128Mi. And 2432Mi of room, for what may run beside them at once: the nightly backup, the hourly cleanup
  # and the reconcile every ten minutes, which can start together and both meet the backup, web's surge, and the two probe pods
  # scripts/test-netpol.sh starts. Pods: those seven, and room for the backup, both CronJobs, two surges, two probes, frameflow-tls's
  # solver and the Silo setup hook.
  frameflow:
    requests.cpu: 1500m
    requests.memory: 4608Mi
    limits.memory: 13824Mi
    pods: "16"
    persistentvolumeclaims: "4"
    # frameflow-data 1, Hatchet's Postgres 5, Silo 25, and the backups PVC's 24.
    requests.storage: 55Gi
  # Stateless web and game pods, one concurrent solver or rollout, and a time-boxed capacity fixture.
  snakebrawl:
    # The public status pod requests 200m. A private Guaranteed 4-CPU stage can run while the arena is held at zero.
    requests.cpu: 4250m
    limits.cpu: "6"
    requests.memory: 2560Mi
    limits.memory: 4Gi
    pods: "10"
    persistentvolumeclaims: "0"
    requests.storage: "0"
# A quota on limits.memory or requests.cpu rejects a pod with no such value. These defaults make such a pod admissible and visibly small,
# instead of failing a sync with a quota error. max is the largest container the sizing table allows here.
limit_ranges:
  plane-prod:
    default: { memory: 256Mi }
    default_request: { cpu: 10m, memory: 64Mi }
    max: { memory: 4Gi }
  argocd:
    default: { memory: 256Mi }
    default_request: { cpu: 10m, memory: 64Mi }
    max: { memory: 1Gi }
  traefik:
    default: { memory: 256Mi }
    default_request: { cpu: 10m, memory: 64Mi }
    max: { memory: 1Gi }
  cert-manager:
    default: { memory: 128Mi }
    default_request: { cpu: 10m, memory: 32Mi }
    max: { memory: 1Gi }
  monitoring:
    default: { memory: 256Mi }
    default_request: { cpu: 10m, memory: 64Mi }
    max: { memory: 2Gi }
  monitoring-agents:
    default: { memory: 64Mi }
    default_request: { cpu: 10m, memory: 24Mi }
    max: { memory: 1Gi }
  infisical:
    default: { memory: 256Mi }
    default_request: { cpu: 10m, memory: 64Mi }
    max: { memory: 1Gi }
  # nginx, the solver and the probe pods each set a 64Mi limit, and max allows twice that.
  rillmark:
    default: { memory: 64Mi }
    default_request: { cpu: 10m, memory: 16Mi }
    max: { memory: 128Mi }
  awushi-cloudgarden:
    default: { memory: 64Mi }
    default_request: { cpu: 10m, memory: 16Mi }
    max: { memory: 128Mi }
  # The worker's 6Gi is the largest container here.
  frameflow:
    default: { memory: 256Mi }
    default_request: { cpu: 10m, memory: 64Mi }
    max: { memory: 6Gi }
  snakebrawl:
    default: { cpu: 250m, memory: 256Mi }
    default_request: { cpu: 10m, memory: 32Mi }
    max: { cpu: "4", memory: 3Gi }
