# /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/50-plane-prod.conf
# K3s sets only disk eviction, which zeroes every other signal, so these are stated in full. Starting values: re-measure.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
imageGCHighThresholdPercent: 75
imageGCLowThresholdPercent: 65
imageMaximumGCAge: 336h
evictionHard:
  memory.available: 1Gi
  nodefs.available: 10%
  imagefs.available: 10%
  nodefs.inodesFree: 5%
  imagefs.inodesFree: 5%
kubeReserved: {cpu: 1000m, memory: 3Gi, ephemeral-storage: 10Gi}
systemReserved: {cpu: 500m, memory: 1Gi, ephemeral-storage: 5Gi}
podPidsLimit: 4096
streamingConnectionIdleTimeout: 5m
