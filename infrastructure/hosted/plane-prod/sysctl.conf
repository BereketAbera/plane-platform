# /etc/sysctl.d/90-wayline.conf. protect-kernel-defaults makes the kubelet refuse to start without these.
vm.panic_on_oom=0
vm.overcommit_memory=1
kernel.panic=10
kernel.panic_on_oops=1

# Ubuntu's 128 inotify instances per user is too few for a node like this. containerd's shims take one each and K3s about 50, so root sat at
# exactly 128 with 40-odd pods running, and following a container's log then failed with "failed to create fsnotify watcher: too many open
# files", which reached Loki as a log line in place of that container's logs. Each pod added takes more, and Frameflow will add some.
fs.inotify.max_user_instances=8192
