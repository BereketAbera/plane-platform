# /etc/ssh/sshd_config.d/00-wayline.conf. The first value sshd reads wins, and Contabo's 50-cloud-init.conf enables passwords,
# so this file must sort first. wayline-pull is a read-only SFTP user for pulling encrypted backups.
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers wayline-admin wayline-pull
AllowTcpForwarding local
X11Forwarding no
MaxAuthTries 3
