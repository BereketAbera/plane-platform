# Expected network reachability on hosted production, for scripts/test-netpol.sh. WAYLINE_TARGET=plane-prod picks this file, and
# make remote-test runs it. Run only after the network-policies Application is Synced, and once Plane is deployed, or its rows read
# INCONCLUSIVE, which is not a pass.
#
# How a row runs is written at the head of tests/network-policy-matrix.yaml and scripts/test-netpol.sh. In short: a NEW short-lived
# pod in from.ns with from.labels, never hostNetwork. kube-router rejects what a policy denies, where the local cluster drops it, so
# here deny passes ONLY on a refusal while the node connected to that port, and allow passes ONLY on a connection. A row needs a port
# that really listens, or it reads INCONCLUSIVE: a refusal alone cannot tell a policy from a closed port.
#
# Made from the local matrix once, by these changes, and edited by hand from here on, so a row of one never appears in the other by
# accident:
# - plane-prod-sim's rows, renamed. There is no other environment, so no rows between the two, and no Docker Desktop host address.
# - 5.253.234.127 is the node, in place of kind's node name. No policy in this cluster allows 172.16.0.0/12.
# - Traefik reaches Plane, Grafana and Infisical's server, the two consoles with a public route. The other admin UIs have no route, so its
#   rows to them are deny, where locally they were allow, and it reaches no database: Infisical's Postgres and Redis sit beside the one it
#   does reach, and those rows are deny.
# - api and blackbox reach Traefik on 443. The web entrypoint only redirects, so nothing but cert-manager's self-check needs 80.
# - Argo CD reads GitHub on 443. No Git remote on a local network.
# - Alertmanager reaches public 443, for Telegram and Healthchecks.
# - New: cert-manager, the HTTP-01 solvers in the three namespaces with a Certificate, the node's own ports from a pod. No frameflow rows:
#   its quota is no pods, so none can start.
#
# Known limit, deliberately not a row: api is allowed to Traefik, and Traefik routes by Host header, so api could ask for any host
# Traefik serves. NetworkPolicy cannot see that. scripts/hosted/test-hosted.sh shows the UI hosts answer 404 to it. Grafana's and Infisical's
# public hosts answer it as they answer anyone, with their logins and what their routes refuse.
#
# Not covered, because a pod cannot exercise it: traffic from outside. scripts/hosted/test-hosted.sh scans from outside.
