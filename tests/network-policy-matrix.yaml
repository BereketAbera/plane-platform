# Expected network reachability, for the integrator's test to execute. Run tests only after the
# network-policies Application is Synced.
#
# How to run a row:
# - Start a NEW short-lived pod in from.ns with from.labels, and connect to to.host:to.port. kindnet
#   evaluates only the first packet of a new connection, so a long-lived pod proves nothing.
#   Never test from a hostNetwork pod: kindnet accepts root sockets on the node without evaluation.
# - Give every probe pod a readinessGate that nothing satisfies. Some labels here are also a Service's
#   whole selector (postgres-exporter, redis-exporter, blackbox-exporter), so a Ready probe would join
#   the Service and receive real traffic.
# - allow passes on a completed connection, or on connection refused: refused means the packet arrived.
# - deny passes ONLY on a timeout. Refused means the packet arrived, so it is a failure. A DNS failure
#   is inconclusive, never a pass. protocol udp rows are DNS lookups.
# - to.port is the Service port. The policy rule is written against the target port.
# - Run a sentinel first: one deny row must time out and one allow row must connect, or kindnet may be
#   failing open.
#
# Not covered, because a pod cannot exercise it: NodePort traffic from the host. tests/e2e/smoke.py
# covers that path through plane.dev.localhost.
#
# Known limit, deliberately not a row: api is allowed to Traefik, and Traefik routes by Host header, so
# api could request the other environment's public hostname. NetworkPolicy cannot see that.
cases:
  # DNS works from every namespace, or every other row is meaningless
  - { from: { ns: plane-dev, labels: { probe: unlabelled } }, to: { host: kube-dns.kube-system.svc.cluster.local, port: 53, protocol: udp }, expect: allow }
  - { from: { ns: plane-prod-sim, labels: { probe: unlabelled } }, to: { host: kube-dns.kube-system.svc.cluster.local, port: 53, protocol: udp }, expect: allow }
  - { from: { ns: traefik, labels: { probe: unlabelled } }, to: { host: kube-dns.kube-system.svc.cluster.local, port: 53, protocol: udp }, expect: allow }
  - { from: { ns: monitoring, labels: { probe: unlabelled } }, to: { host: kube-dns.kube-system.svc.cluster.local, port: 53, protocol: udp }, expect: allow }
  - { from: { ns: infisical, labels: { probe: unlabelled } }, to: { host: kube-dns.kube-system.svc.cluster.local, port: 53, protocol: udp }, expect: allow }
  - { from: { ns: argocd, labels: { probe: unlabelled } }, to: { host: kube-dns.kube-system.svc.cluster.local, port: 53, protocol: udp }, expect: allow }

