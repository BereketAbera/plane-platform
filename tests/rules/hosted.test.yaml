# The rules only hosted production has, in gitops/clusters/plane-prod/platform/monitoring-extras/shared. Run by promtool from
# scripts/ci/validate-manifests.sh, which writes each PrometheusRule's spec beside a copy of this file as rules-<name>.yaml.
#
# Each number here is the hosted design's: disk 20% and 10%, certificate 21 days, served certificate 14 days, a static site 2 minutes,
# backup 26 hours.
rule_files:
  - rules-hosted.yaml
  - rules-hosted-plane.yaml
  - rules-hosted-platform.yaml
evaluation_interval: 30s
tests:
  - name: disk warns under 20 percent and is critical under 10, each only after holding
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{mountpoint="/",instance="n",job="node-exporter",fstype="ext4",device="/dev/sda1"}'
        values: '100x40'
      # 25 percent free for 5m, then 15 for 15m, then 8.
      - series: 'node_filesystem_avail_bytes{mountpoint="/",instance="n",job="node-exporter",fstype="ext4",device="/dev/sda1"}'
        values: '25x4 15x14 8x20'
    alert_rule_test:
      - { eval_time: 4m, alertname: NodeDiskLow, exp_alerts: [] }
      - { eval_time: 10m, alertname: NodeDiskLow, exp_alerts: [] }
      - eval_time: 16m
        alertname: NodeDiskLow
        exp_alerts:
          - exp_labels: { mountpoint: /, instance: n, job: node-exporter, fstype: ext4, device: /dev/sda1, severity: warning, component: node }
            exp_annotations: { summary: "The node's disk has 15% free" }
      - { eval_time: 16m, alertname: NodeDiskCritical, exp_alerts: [] }
      - { eval_time: 21m, alertname: NodeDiskCritical, exp_alerts: [] }
      - eval_time: 26m
        alertname: NodeDiskCritical
        exp_alerts:
          - exp_labels: { mountpoint: /, instance: n, job: node-exporter, fstype: ext4, device: /dev/sda1, severity: critical, component: node }
            exp_annotations: { summary: "The node's disk has 8% free, and at 10% the kubelet evicts pods" }
      - { eval_time: 26m, alertname: NodeDiskNotRead, exp_alerts: [] }
  - name: another filesystem running out says nothing, because only the root filesystem is watched
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{mountpoint="/boot",instance="n"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{mountpoint="/boot",instance="n"}'
        values: '1x40'
      - series: 'node_filesystem_size_bytes{mountpoint="/",instance="n"}'
        values: '100x40'
      - series: 'node_filesystem_avail_bytes{mountpoint="/",instance="n"}'
        values: '50x40'
    alert_rule_test:
      - { eval_time: 30m, alertname: NodeDiskLow, exp_alerts: [] }
      - { eval_time: 30m, alertname: NodeDiskCritical, exp_alerts: [] }
  - name: with no reading of the disk at all, the rule that says so fires
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter"}'
        values: '1x40'
    alert_rule_test:
      - { eval_time: 10m, alertname: NodeDiskNotRead, exp_alerts: [] }
      - eval_time: 16m
        alertname: NodeDiskNotRead
        exp_alerts:
          - exp_labels: { mountpoint: /, severity: warning, component: node }
            exp_annotations: { summary: "Nothing reports the root filesystem, so the disk alerts cannot fire" }
  - name: a certificate with 30 days left is quiet, and one with under 21 is not
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="plane-prod",name="healthy"}'
        values: '2592000x10'
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="plane-prod",name="renewal-failing"}'
        values: '1814400x10'
    alert_rule_test:
      # renewal-failing has exactly 21 days at the start, so it fires only once the time passes it.
      - { eval_time: 0m, alertname: CertificateExpiringSoon, exp_alerts: [] }
      - eval_time: 1m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels: { namespace: plane-prod, name: renewal-failing, severity: warning, component: certificate }
            exp_annotations: { summary: "Certificate plane-prod/renewal-failing expires in 20d 23h 59m 0s, so renewal is failing" }
  - name: a certificate not issued yet reads an expiry of 0, which is no renewal failing, and once issued with 14 days it fires as before
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="infisical",name="infisical-tls"}'
        values: '0x5 1209600x5'
    alert_rule_test:
      - { eval_time: 0m, alertname: CertificateExpiringSoon, exp_alerts: [] }
      - { eval_time: 5m, alertname: CertificateExpiringSoon, exp_alerts: [] }
      - eval_time: 8m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels: { namespace: infisical, name: infisical-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "Certificate infisical/infisical-tls expires in 13d 23h 52m 0s, so renewal is failing" }
  - name: a certificate that stays not Ready fires, while one being issued has 30 minutes
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{namespace="plane-prod",name="wayline-tls",condition="False"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="plane-prod",name="wayline-tls",condition="True"}'
        values: '0x40'
      - series: 'certmanager_certificate_ready_status{namespace="plane-prod",name="other",condition="False"}'
        values: '0x40'
      - series: 'certmanager_certificate_ready_status{namespace="plane-prod",name="other",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="monitoring",name="grafana-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="infisical",name="infisical-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="rillmark",name="rillmark-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="awushi-cloudgarden",name="devops-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="frameflow",name="frameflow-tls",condition="True"}'
        values: '1x40'
    alert_rule_test:
      - { eval_time: 29m, alertname: CertificateNotReady, exp_alerts: [] }
      - eval_time: 31m
        alertname: CertificateNotReady
        exp_alerts:
          - exp_labels: { namespace: plane-prod, name: wayline-tls, condition: "False", severity: critical, component: certificate }
            exp_annotations: { summary: "Certificate plane-prod/wayline-tls has not been Ready for 30m" }
      - { eval_time: 31m, alertname: CertificateNotWatched, exp_alerts: [] }
  - name: cert-manager reporting nothing for any of the six certificates fires, because the rules above would stay silent
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{namespace="plane-prod",name="another",condition="True"}'
        values: '1x40'
    alert_rule_test:
      - { eval_time: 29m, alertname: CertificateNotWatched, exp_alerts: [] }
      - eval_time: 31m
        alertname: CertificateNotWatched
        exp_alerts:
          - exp_labels: { name: wayline-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "cert-manager reports nothing for wayline-tls, so the certificate alerts cannot fire" }
          - exp_labels: { name: grafana-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "cert-manager reports nothing for grafana-tls, so the certificate alerts cannot fire" }
          - exp_labels: { name: infisical-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "cert-manager reports nothing for infisical-tls, so the certificate alerts cannot fire" }
          - exp_labels: { name: rillmark-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "cert-manager reports nothing for rillmark-tls, so the certificate alerts cannot fire" }
          - exp_labels: { name: devops-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "cert-manager reports nothing for devops-tls, so the certificate alerts cannot fire" }
          - exp_labels: { name: frameflow-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "cert-manager reports nothing for frameflow-tls, so the certificate alerts cannot fire" }
  - name: with only infisical-tls missing, the same rule names it alone
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{namespace="plane-prod",name="wayline-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="monitoring",name="grafana-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="rillmark",name="rillmark-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="awushi-cloudgarden",name="devops-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="frameflow",name="frameflow-tls",condition="True"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CertificateNotWatched
        exp_alerts:
          - exp_labels: { name: infisical-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "cert-manager reports nothing for infisical-tls, so the certificate alerts cannot fire" }
  - name: with only the static sites' certificates missing, the same rule names each of them, and the others it watches stay quiet
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{namespace="plane-prod",name="wayline-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="monitoring",name="grafana-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="infisical",name="infisical-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="frameflow",name="frameflow-tls",condition="True"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CertificateNotWatched
        exp_alerts:
          - exp_labels: { name: rillmark-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "cert-manager reports nothing for rillmark-tls, so the certificate alerts cannot fire" }
          - exp_labels: { name: devops-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "cert-manager reports nothing for devops-tls, so the certificate alerts cannot fire" }
  - name: with only Frameflow's certificate missing, the same rule names it alone
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{namespace="plane-prod",name="wayline-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="monitoring",name="grafana-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="infisical",name="infisical-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="rillmark",name="rillmark-tls",condition="True"}'
        values: '1x40'
      - series: 'certmanager_certificate_ready_status{namespace="awushi-cloudgarden",name="devops-tls",condition="True"}'
        values: '1x40'
    alert_rule_test:
      - { eval_time: 29m, alertname: CertificateNotWatched, exp_alerts: [] }
      - eval_time: 31m
        alertname: CertificateNotWatched
        exp_alerts:
          - exp_labels: { name: frameflow-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "cert-manager reports nothing for frameflow-tls, so the certificate alerts cannot fire" }
  - name: infisical-tls fires like any other certificate, under the namespace it lives in
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{namespace="infisical",name="infisical-tls",condition="False"}'
        values: '1x40'
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="infisical",name="infisical-tls"}'
        values: '1209600x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CertificateNotReady
        exp_alerts:
          - exp_labels: { namespace: infisical, name: infisical-tls, condition: "False", severity: critical, component: certificate }
            exp_annotations: { summary: "Certificate infisical/infisical-tls has not been Ready for 30m" }
      - eval_time: 1m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels: { namespace: infisical, name: infisical-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "Certificate infisical/infisical-tls expires in 13d 23h 59m 0s, so renewal is failing" }
  - name: the static sites' certificates fire like any other, each under the namespace it lives in
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{namespace="rillmark",name="rillmark-tls",condition="False"}'
        values: '1x40'
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="awushi-cloudgarden",name="devops-tls"}'
        values: '1209600x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CertificateNotReady
        exp_alerts:
          - exp_labels: { namespace: rillmark, name: rillmark-tls, condition: "False", severity: critical, component: certificate }
            exp_annotations: { summary: "Certificate rillmark/rillmark-tls has not been Ready for 30m" }
      - eval_time: 1m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels: { namespace: awushi-cloudgarden, name: devops-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "Certificate awushi-cloudgarden/devops-tls expires in 13d 23h 59m 0s, so renewal is failing" }
  - name: grafana-tls fires like any other certificate, under the namespace it lives in
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{namespace="monitoring",name="grafana-tls",condition="False"}'
        values: '1x40'
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="monitoring",name="grafana-tls"}'
        values: '1209600x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: CertificateNotReady
        exp_alerts:
          - exp_labels: { namespace: monitoring, name: grafana-tls, condition: "False", severity: critical, component: certificate }
            exp_annotations: { summary: "Certificate monitoring/grafana-tls has not been Ready for 30m" }
      - eval_time: 1m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels: { namespace: monitoring, name: grafana-tls, severity: warning, component: certificate }
            exp_annotations: { summary: "Certificate monitoring/grafana-tls expires in 13d 23h 59m 0s, so renewal is failing" }
  - name: the served certificate fires under 14 days, on the soonest of the probes in a namespace
    interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{namespace="plane-prod",instance="https://wayline.bereket.dev/",probe="frontend"}'
        values: '1209660x10'
      - series: 'probe_ssl_earliest_cert_expiry{namespace="plane-prod",instance="https://wayline.bereket.dev/live/health",probe="live"}'
        values: '2592000x10'
    alert_rule_test:
      - { eval_time: 0m, alertname: ServedCertificateExpiringSoon, exp_alerts: [] }
      - eval_time: 2m
        alertname: ServedCertificateExpiringSoon
        exp_alerts:
          - exp_labels: { namespace: plane-prod, severity: critical, component: certificate }
            exp_annotations: { summary: "The certificate served for plane-prod expires in 13d 23h 59m 0s" }
  - name: the certificate served at Grafana's route fires on its own, in the namespace of its Probe, and with Plane's healthy
    interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{namespace="monitoring",instance="https://grafana.bereket.dev/login",probe="grafana"}'
        values: '1209660x10'
      - series: 'probe_ssl_earliest_cert_expiry{namespace="plane-prod",instance="https://wayline.bereket.dev/",probe="frontend"}'
        values: '2592000x10'
    alert_rule_test:
      - { eval_time: 0m, alertname: ServedCertificateExpiringSoon, exp_alerts: [] }
      - eval_time: 2m
        alertname: ServedCertificateExpiringSoon
        exp_alerts:
          - exp_labels: { namespace: monitoring, severity: critical, component: certificate }
            exp_annotations: { summary: "The certificate served for monitoring expires in 13d 23h 59m 0s" }
  - name: the certificate served at Infisical's route fires under its own namespace, with Grafana's and Plane's healthy
    interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{namespace="infisical",instance="https://infisical.bereket.dev/login",probe="infisical"}'
        values: '1209660x10'
      - series: 'probe_ssl_earliest_cert_expiry{namespace="infisical",instance="https://infisical.bereket.dev/api/v1/admin/config",probe="infisical-claimed"}'
        values: '1209660x10'
      - series: 'probe_ssl_earliest_cert_expiry{namespace="monitoring",instance="https://grafana.bereket.dev/login",probe="grafana"}'
        values: '2592000x10'
      - series: 'probe_ssl_earliest_cert_expiry{namespace="plane-prod",instance="https://wayline.bereket.dev/",probe="frontend"}'
        values: '2592000x10'
    alert_rule_test:
      - { eval_time: 0m, alertname: ServedCertificateExpiringSoon, exp_alerts: [] }
      - eval_time: 2m
        alertname: ServedCertificateExpiringSoon
        exp_alerts:
          - exp_labels: { namespace: infisical, severity: critical, component: certificate }
            exp_annotations: { summary: "The certificate served for infisical expires in 13d 23h 59m 0s" }
  - name: a new app's Probe in its own namespace is covered by the same rule, with nothing added for it
    interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{namespace="frameflow",instance="https://frameflow.bereket.dev/",probe="frameflow"}'
        values: '1209660x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: ServedCertificateExpiringSoon
        exp_alerts:
          - exp_labels: { namespace: frameflow, severity: critical, component: certificate }
            exp_annotations: { summary: "The certificate served for frameflow expires in 13d 23h 59m 0s" }
  - name: the certificate served at a static site fires under that site's namespace, with the other site's and Plane's healthy
    interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{namespace="awushi-cloudgarden",instance="https://devops.bereket.dev/",probe="cloudgarden"}'
        values: '1209660x10'
      - series: 'probe_ssl_earliest_cert_expiry{namespace="rillmark",instance="https://rillmark.bereket.dev/",probe="rillmark"}'
        values: '2592000x10'
      - series: 'probe_ssl_earliest_cert_expiry{namespace="plane-prod",instance="https://wayline.bereket.dev/",probe="frontend"}'
        values: '2592000x10'
    alert_rule_test:
      - { eval_time: 0m, alertname: ServedCertificateExpiringSoon, exp_alerts: [] }
      - eval_time: 2m
        alertname: ServedCertificateExpiringSoon
        exp_alerts:
          - exp_labels: { namespace: awushi-cloudgarden, severity: critical, component: certificate }
            exp_annotations: { summary: "The certificate served for awushi-cloudgarden expires in 13d 23h 59m 0s" }
  - name: Grafana's route failing its probe warns after 5 minutes, and no probe at all says so after 15
    interval: 1m
    input_series:
      - series: 'probe_success{namespace="monitoring",probe="grafana",instance="https://grafana.bereket.dev/login"}'
        values: '1x4 0x20'
    alert_rule_test:
      - { eval_time: 3m, alertname: GrafanaRouteDown, exp_alerts: [] }
      - { eval_time: 8m, alertname: GrafanaRouteDown, exp_alerts: [] }
      - eval_time: 11m
        alertname: GrafanaRouteDown
        exp_alerts:
          - exp_labels: { namespace: monitoring, probe: grafana, instance: "https://grafana.bereket.dev/login", severity: warning, component: grafana }
            exp_annotations: { summary: "https://grafana.bereket.dev has failed its probe for 5m. The console is still reachable with make remote-ui" }
      - { eval_time: 16m, alertname: GrafanaRouteNotWatched, exp_alerts: [] }
  - name: with no probe of Grafana's route running, the rule that says so fires
    interval: 1m
    input_series:
      - series: 'probe_success{namespace="plane-prod",probe="frontend"}'
        values: '1x40'
    alert_rule_test:
      - { eval_time: 14m, alertname: GrafanaRouteNotWatched, exp_alerts: [] }
      - eval_time: 16m
        alertname: GrafanaRouteNotWatched
        exp_alerts:
          - exp_labels: { probe: grafana, severity: warning, component: grafana }
            exp_annotations: { summary: "The probe of https://grafana.bereket.dev is not running, so GrafanaRouteDown cannot fire" }
  - name: Infisical's route failing its probe warns after 5 minutes, and says the operator does not use it
    interval: 1m
    input_series:
      - series: 'probe_success{namespace="infisical",probe="infisical",instance="https://infisical.bereket.dev/login"}'
        values: '1x4 0x20'
      - series: 'probe_success{namespace="infisical",probe="infisical-sign-in",instance="https://infisical.bereket.dev/api/v1/password/password-setup"}'
        values: '1x24'
      - series: 'probe_success{namespace="infisical",probe="infisical-session",instance="https://infisical.bereket.dev/api/v1/auth/token"}'
        values: '1x24'
    alert_rule_test:
      - { eval_time: 3m, alertname: InfisicalRouteDown, exp_alerts: [] }
      - { eval_time: 8m, alertname: InfisicalRouteDown, exp_alerts: [] }
      - eval_time: 11m
        alertname: InfisicalRouteDown
        exp_alerts:
          - exp_labels: { namespace: infisical, probe: infisical, instance: "https://infisical.bereket.dev/login", severity: warning, component: infisical }
            exp_annotations: { summary: "https://infisical.bereket.dev/login has failed its probe for 5m. Infisical is still reachable with make remote-ui, and the operator does not use this route" }
      - { eval_time: 16m, alertname: InfisicalRouteNotWatched, exp_alerts: [] }
  # With a limit's Middleware gone, Traefik answers that part of the route 404, while the page and the config still answer 200.
  - name: a failing probe of the sign-in or the session part fires InfisicalRouteDown for that path alone
    interval: 1m
    input_series:
      - series: 'probe_success{namespace="infisical",probe="infisical",instance="https://infisical.bereket.dev/login"}'
        values: '1x24'
      - series: 'probe_success{namespace="infisical",probe="infisical-sign-in",instance="https://infisical.bereket.dev/api/v1/password/password-setup"}'
        values: '1x4 0x20'
      - series: 'probe_success{namespace="infisical",probe="infisical-session",instance="https://infisical.bereket.dev/api/v1/auth/token"}'
        values: '1x14 0x10'
    alert_rule_test:
      - eval_time: 11m
        alertname: InfisicalRouteDown
        exp_alerts:
          - exp_labels: { namespace: infisical, probe: infisical-sign-in, instance: "https://infisical.bereket.dev/api/v1/password/password-setup", severity: warning, component: infisical }
            exp_annotations: { summary: "https://infisical.bereket.dev/api/v1/password/password-setup has failed its probe for 5m. Infisical is still reachable with make remote-ui, and the operator does not use this route" }
      - eval_time: 21m
        alertname: InfisicalRouteDown
        exp_alerts:
          - exp_labels: { namespace: infisical, probe: infisical-sign-in, instance: "https://infisical.bereket.dev/api/v1/password/password-setup", severity: warning, component: infisical }
            exp_annotations: { summary: "https://infisical.bereket.dev/api/v1/password/password-setup has failed its probe for 5m. Infisical is still reachable with make remote-ui, and the operator does not use this route" }
          - exp_labels: { namespace: infisical, probe: infisical-session, instance: "https://infisical.bereket.dev/api/v1/auth/token", severity: warning, component: infisical }
            exp_annotations: { summary: "https://infisical.bereket.dev/api/v1/auth/token has failed its probe for 5m. Infisical is still reachable with make remote-ui, and the operator does not use this route" }
  - name: with no probe of Infisical's route or claim running, the rules that say so fire, one for each probe
    interval: 1m
    input_series:
      - series: 'probe_success{namespace="plane-prod",probe="frontend"}'
        values: '1x40'
    alert_rule_test:
      - { eval_time: 14m, alertname: InfisicalRouteNotWatched, exp_alerts: [] }
      - eval_time: 16m
        alertname: InfisicalRouteNotWatched
        exp_alerts:
          - exp_labels: { probe: infisical, severity: warning, component: infisical }
            exp_annotations: { summary: "The probe infisical of https://infisical.bereket.dev is not running, so InfisicalRouteDown cannot fire for it" }
          - exp_labels: { probe: infisical-sign-in, severity: warning, component: infisical }
