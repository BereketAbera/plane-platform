# Extends the default rules, minus paths that are generated, vendored, or never committed.
title = "plane-platform"

[extend]
useDefault = true

# The generic-api-key rule treats a Valkey image tag such as valkey:7.2.15-alpine as a credential,
# because the name ends in "key". This matches only that image reference shape, never a whole
# file, so a real secret nearby is still caught.
[[allowlists]]
description = "Valkey image tags"
regexTarget = "match"
regexes = ['''valkey:[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+)?''']

# Host state and tools are gitignored, and .local/ legitimately holds real secrets. The vendored
# chart is byte-identical upstream, and its secret-looking defaults are public example values that
# the existingSecret keys suppress.
[[allowlists]]
description = "Generated, vendored, or never committed"
paths = [
  '''^\.tools/''',
  '''^\.local/''',
  '''^\.git/''',
  '''^\.build/''',
  '''(^|/)\.terraform/''',
  '''^helm/plane/vendor/''',
]
