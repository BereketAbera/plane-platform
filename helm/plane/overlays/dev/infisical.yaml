apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: plane-doc-store
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  infisicalAuthRef:
    name: infisical
    namespace: plane-dev
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: plane-dev
      environmentSlug: prod
      secretPath: /
  targets:
    - name: plane-doc-store
      namespace: plane-dev
      kind: Secret
      secretType: Opaque
      creationPolicy: Owner
      metadata:
        labels:
          app.kubernetes.io/part-of: plane
        annotations: {}
      template:
        engineVersion: v1
        data:
          USE_MINIO: "1"
          MINIO_ROOT_USER: '{{ (secretFrom "/" "SILO_ACCESS_KEY").Value }}'
          MINIO_ROOT_PASSWORD: '{{ (secretFrom "/" "SILO_SECRET_KEY").Value }}'
          AWS_ACCESS_KEY_ID: '{{ (secretFrom "/" "SILO_ACCESS_KEY").Value }}'
          AWS_SECRET_ACCESS_KEY: '{{ (secretFrom "/" "SILO_SECRET_KEY").Value }}'
          AWS_S3_BUCKET_NAME: uploads
          AWS_S3_ENDPOINT_URL: http://plane-minio:9000
          # Bytes. Django crashes at import on a value like 5MB.
          FILE_SIZE_LIMIT: "5242880"
---
