# The chart can only create one account with automount hard-coded to true, so values set
# serviceAccount.create=false and these replace it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plane
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
# Used by no pod. The operator mints short-lived tokens for it to log in to Infisical, and it
# holds system:auth-delegator (platform project), so a workload must never run as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plane-infisical-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
