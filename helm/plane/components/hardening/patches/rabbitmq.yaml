apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plane-rabbitmq-wl
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rabbitmq
    spec:
      securityContext:
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: plane-rabbitmq
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          # TCP for every probe: rabbitmq-diagnostics boots an Erlang VM on each call. On a CPU-starved node
          # that took longer than its 30 s limit, so the liveness probe restarted a healthy broker in a loop.
          startupProbe:
            tcpSocket: {port: 5672}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: 5672}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: 5672}
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # subPath, because mounting the directory would hide the image's 10-defaults.conf.
          volumeMounts:
            - name: rabbitmq-conf
              mountPath: /etc/rabbitmq/conf.d/20-memory.conf
              subPath: 20-memory.conf
              readOnly: true
      volumes:
        - name: rabbitmq-conf
          configMap:
            name: plane-rabbitmq-conf
