apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-worker-wl
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: plane-worker
          env:
            - {name: HOME, value: /tmp}
            # The entrypoint passes no -c, and Celery forks per CPU the node reports (12 here),
            # not per CPU limit. Celery reads this through click's auto_envvar_prefix.
            - {name: CELERY_WORKER_CONCURRENCY, value: "2"}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          # exec with no shell: under `sh -c` pgrep -f would match the shell's own command line.
          startupProbe:
            exec:
              command: [pgrep, -f, celery -A plane worker]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pgrep, -f, celery -A plane worker]
            periodSeconds: 15
            timeoutSeconds: 5
          # Loads all of Django, so it is costly: keep it infrequent. It needs the broker, so three
          # failures mean six minutes of RabbitMQ outage before a restart.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec celery -A plane inspect ping -d "celery@$(hostname)" -t 10
            periodSeconds: 120
            timeoutSeconds: 60
            failureThreshold: 3
