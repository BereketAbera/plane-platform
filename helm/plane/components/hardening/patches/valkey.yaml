apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plane-redis-wl
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: valkey
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
      containers:
        - name: plane-redis
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 96Mi}
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 30
            timeoutSeconds: 5
