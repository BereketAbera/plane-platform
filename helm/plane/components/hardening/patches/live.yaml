apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-live-wl
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: live
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: plane-live
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {cpu: 250m, memory: 384Mi}
          startupProbe:
            httpGet: {path: /live/health, port: 3000}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /live/health, port: 3000}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /live/health, port: 3000}
            periodSeconds: 30
            timeoutSeconds: 5
