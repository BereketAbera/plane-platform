apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-space-wl
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: space
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: plane-space
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /spaces/, port: 3000}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /spaces/, port: 3000}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /spaces/, port: 3000}
            periodSeconds: 30
            timeoutSeconds: 5
