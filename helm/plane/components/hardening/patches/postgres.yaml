apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plane-pgdb-wl
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
      containers:
        - name: plane-pgdb
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          # TCP on purpose: during initdb the server listens only on the Unix socket, so this stays
          # unready until the real server is up. The migrator's wait_for_db does not wait, so
          # wave 2 depends on this being accurate.
          startupProbe:
            exec:
              command: [sh, -c, pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [sh, -c, pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"]
            periodSeconds: 30
            timeoutSeconds: 5
