# alloy 1.15.0 from https://grafana.github.io/helm-charts. Release name alloy, namespace monitoring.
# A Deployment reading logs through the Kubernetes API, not a DaemonSet tailing /var/log/pods:
# it needs no root, no hostPath and no privileged namespace (critique C17). The cost is more
# kubelet traffic, and it is small: a second Alloy on the same 53 log streams added 6 to 40 MiB to
# apiserver RSS and about 20 MiB to the kubelet's, with CPU inside the noise. So the fallback, a
# DaemonSet in monitoring-agents, is not needed at this size.
controller:
  type: deployment
  replicas: 1
  volumes:
    extra:
      - name: storage
        emptyDir: { sizeLimit: 256Mi }

global:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 473 # the image has no USER and would otherwise run as root
    runAsGroup: 473
    fsGroup: 473
    seccompProfile: { type: RuntimeDefault }

image:
  registry: docker.io
  repository: grafana/alloy
  tag: v1.21.3-distroless
  digest: sha256:12ff3a82e402d34b450e7cb0555ff9703da645068dc321b2a98b9f1c110ab9e2

# Podlogs CRD and the reloader sidecar are both unused. With the reloader off the chart sets
# checksum/config on the pod template, so a config change still rolls out through Argo CD.
crds: { create: false }
configReloader: { enabled: false }

# The chart default grants cluster-wide read on every Secret and ConfigMap. Tailing logs needs
# only pods and their logs. clusterRules must stay non-empty: the template prints it after rules
# with toYaml, and an empty list renders as invalid YAML.
rbac:
  rules:
    - apiGroups: [""]
      resources: [pods, pods/log]
      verbs: [get, list, watch]
  clusterRules:
    - apiGroups: [""]
      resources: [namespaces]
      verbs: [get, list, watch]

serviceMonitor:
  enabled: true

alloy:
  enableReporting: false
  # Holds tail positions, on an emptyDir, so a new pod re-reads each container's log. Measured over a
  # pod replacement: no line lost or duplicated, peak 91 MiB. Loki answers 400 for lines over an hour
  # behind their stream, and Alloy logs those as dropped. They were stored the first time round.
  # An in-place container restart is different: the emptyDir survives it, so nothing is re-read, while the
  # counters below live in memory and start from zero. KindnetSkippedNetworkPolicies holds its count for 3d
  # because of this (monitoring/manifests/shared/rules-platform.yaml).
  storagePath: /var/lib/alloy
  mounts:
    extra:
      - name: storage
        mountPath: /var/lib/alloy
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
  livenessProbe:
    httpGet: { path: /-/healthy, port: 12345 }
    initialDelaySeconds: 30
    periodSeconds: 30
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  extraEnv:
    - { name: GOMEMLIMIT, value: 220MiB }
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // kube-system holds only kindnet's own container, for the fail-open line counted below.
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          regex         = "(plane-dev|plane-prod-sim|infisical|argocd|traefik|monitoring);.*|kube-system;kindnet-cni"
          action        = "keep"
        }
        // Finished pods have nothing left to tail, and each dead target would retry forever.
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Succeeded|Failed"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pods.receiver]
      }

      // No stage.cri: the API returns plain lines, and that stage only applies to log files.
      loki.process "pods" {
        // kindnet fails open: if its policy controller cannot start, it logs this line once at INFO and
        // runs on with no NetworkPolicy enforced. KindnetSkippedNetworkPolicies alerts on the counter. The
        // series must outlive a long idle, because the line never repeats and the default expiry is 5m.
        stage.match {
          selector = "{namespace=\"kube-system\", container=\"kindnet-cni\"} |~ \"skipping network policies\""
          stage.metrics {
            metric.counter {
              name              = "kindnet_netpol_skipped_total"
              description       = "Lines where kindnet said it is skipping network policies"
              match_all         = true
              action            = "inc"
              max_idle_duration = "8760h"
            }
          }
        }
        // The rest is a heartbeat every 10s. Counting it proves this tail is alive, which
        // KindnetLogsNotRead watches, and keeping it out of Loki keeps the log volume as it was.
        stage.match {
          selector = "{namespace=\"kube-system\", container=\"kindnet-cni\"}"
          stage.metrics {
            metric.counter {
              name        = "kindnet_log_lines_total"
              description = "Lines Alloy read from kindnet"
              match_all   = true
              action      = "inc"
            }
          }
        }
        stage.match {
          selector            = "{namespace=\"kube-system\", container=\"kindnet-cni\"} !~ \"skipping network policies\""
          action              = "drop"
          drop_counter_reason = "kindnet_heartbeat"
        }
        // Blackbox probes the API every 15s from each environment. Without this those access
        // lines would outnumber real requests in the Logs dashboard.
        stage.drop {
          expression          = ".*Blackbox-Exporter.*"
          drop_counter_reason = "probe_noise"
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
