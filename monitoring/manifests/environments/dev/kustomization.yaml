apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plane-dev
resources:
  - ../base
patches:
  - target: { kind: Service, name: plane-rabbitmq-metrics }
    patch: |
      - { op: replace, path: /spec/selector/app.name, value: plane-dev-plane-rabbitmq }
  - target: { kind: ServiceMonitor, name: plane-minio }
    patch: |
      - { op: replace, path: /spec/selector/matchLabels/app.name, value: plane-dev-plane-minio }
  # Every Probe gets the same two values.
  - target: { kind: Probe }
    patch: |
      - { op: replace, path: /spec/targets/staticConfig/labels/env, value: dev }
      - { op: replace, path: /spec/targets/staticConfig/relabelingConfigs/0/replacement, value: plane.dev.localhost }
