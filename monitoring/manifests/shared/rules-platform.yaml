apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform
spec:
  groups:
    - name: platform.workloads
      interval: 30s
      rules:
        # Reads the samples as they are: one restart is 1 and two are 2, whatever the series' age and wherever the
        # evaluation falls between two scrapes. increase() cannot do that. It extrapolates towards the ends of its window,
        # so on a series with only two samples one restart reads up to nearly 2 (1.97 in promtool), and how close it gets
        # depends on how long after the scrape the group evaluates. tests/rules/pod-restarting.test.yaml walks those offsets.
        - alert: PodRestarting
          expr: |
            max_over_time(kube_pod_container_status_restarts_total{namespace=~"plane-.*|monitoring|monitoring-agents|argocd|traefik|infisical"}[15m])
              - min_over_time(kube_pod_container_status_restarts_total{namespace=~"plane-.*|monitoring|monitoring-agents|argocd|traefik|infisical"}[15m])
              >= 2
          labels: { severity: warning, component: pod }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} restarted more than once in 15m"
        - alert: ContainerMemorySaturation
          expr: |
            sum by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~"plane-.*|monitoring|monitoring-agents|argocd|traefik|infisical",container!="",container!="POD"})
              / on (namespace, pod, container)
            sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
              > 0.9
          for: 5m
          labels: { severity: warning, component: pod }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is at {{ $value | humanizePercentage }} of its memory limit"
        # Container limits add up to more than the VM on purpose, so the VM can run out first.
        - alert: VmMemoryLow
          expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
          for: 5m
          labels: { severity: warning, component: node }
          annotations:
            summary: Docker VM has {{ $value | humanizePercentage }} of its memory available
    # kindnet fails open: if its policy controller cannot start, it logs "skipping network policies" once at
    # INFO, and every NetworkPolicy stops being enforced with nothing else to show for it. Alloy counts that
    # line (helm/values/alloy.yaml), and the chart's ServiceMonitor honors the labels it carries, so namespace
    # and pod name kindnet. This sees that one log line and nothing else: `make test-netpol`, which sends real
    # traffic, remains the real check.
    #
    # The count lives in Alloy's memory, and its read positions on an emptyDir that survives a container
    # restart. So any in-place Alloy restart, an OOM kill or a liveness failure, empties the count and never
    # reads the line again, rotated or not. Measured on the heartbeat counter beside it: 6244 before, then 19 and
    # 67, with 6328 lines in kindnet's log. So the rule reads the highest count of the last 3d, which is
    # Prometheus's retention, and retentionSize can end that sooner. Past that window a line Alloy forgot resolves
    # this while kindnet may still be failing open.
    #
    # The opposite error remains. A count stands for a pod name, not a container, so if kindnet's container
    # restarts in the same pod and comes up healthy, this keeps firing: while Alloy keeps the count in memory,
    # and for 3d after it forgets it. Once `make test-netpol` passes, replacing the pod clears it, because a
    # count no longer applies once its pod is gone. The 5m on kube_pod_info is there so that a
    # kube-state-metrics restart does not resolve this by itself.
    - name: platform.network
      interval: 30s
      rules:
        - alert: KindnetSkippedNetworkPolicies
          expr: |
            max by (namespace, pod) (max_over_time(loki_process_custom_kindnet_netpol_skipped_total[3d]))
              and on (namespace, pod)
            max_over_time(kube_pod_info{namespace="kube-system"}[5m])
          labels: { severity: critical, component: network }
          annotations:
            summary: kindnet pod {{ $labels.pod }} logged that it is skipping network policies, so NetworkPolicies are not enforced
        # Without this, a broken tail would leave the alert above silently unable to fire. The series expires
        # 5m after kindnet's last line, and kindnet logs every 10s.
        - alert: KindnetLogsNotRead
          expr: absent(loki_process_custom_kindnet_log_lines_total)
          for: 10m
          labels: { severity: warning, component: network }
          annotations:
            summary: Alloy has read no kindnet log line for 15m, so KindnetSkippedNetworkPolicies cannot fire
    # No disk rule here on purpose: the VM filesystem reports hundreds of free GiB on a sparse disk
    # while the Mac runs out first. guard_disk in scripts/lib/common.sh is the real check.
    - name: platform.argocd
      interval: 30s
      rules:
        # argocd_app_info carries sync_status, health_status, operation and autosync_enabled, and for: starts
        # again whenever a series' labels change. These aggregate those away so a flapping Application
        # still fires. for: is longer than scripts/test-alert.sh and restore.sh hold self-heal off, so drills
        # that pause Argo do not page. A real drift still fires.
        - alert: ArgoAppOutOfSync
          expr: max by (name, dest_namespace) (argocd_app_info{sync_status="OutOfSync"}) == 1
          for: 15m
          labels: { severity: warning, component: argocd }
          annotations:
            summary: Application {{ $labels.name }} has been out of sync for 15m
        # A commit Argo CD cannot render, or a Git it cannot read. The sync status goes Unknown on that load failure
        # (controller/state.go:1034 at v3.5.7) and health stays as it was, usually Healthy. Auto-sync runs only from
        # OutOfSync (controller/appcontroller.go:2432), so no operation opens, nothing retries, and the running state
        # silently stays on the old commit with none of the other rules here matching. Measured on a throwaway with
        # a path that does not exist: Unknown, Healthy, no operation, condition ComparisonError. max_over_time rides
        # out a controller restart, as for ArgoSyncFailed below. On an Application that was rendering, the controller's
        # looks were measured 120 to 289s apart, median 193s (--app-resync 120s, --app-resync-jitter 60s), because a resync
        # is skipped when the previous look landed later in its jitter. From the first look that fails it ignores the
        # failure for 180s (--repo-error-grace-period-seconds). One real commit read Unknown 5m57s after it, with its
        # object still there. That is one sample, and with for: it makes about 21m from commit to alert, an estimate. By
        # reading, the first look that fails only starts the grace and a later one has to land past it, and a look can
        # read the old main from the repo server's ref cache for up to 120s after a commit. So it can take up to about 11m
        # to read Unknown, which makes up to about 26m. Both are estimates.
        - alert: ArgoAppSyncUnknown
          expr: max by (name, dest_namespace) (max_over_time(argocd_app_info{sync_status="Unknown"}[2m])) == 1
          for: 15m
          labels: { severity: warning, component: argocd }
          annotations:
            summary: Argo CD has been unable to compare Application {{ $labels.name }} with Git for 15m, so new commits do not reach it
            description: A commit that cannot render, or a Git that cannot be read, leaves sync Unknown and starts no sync. status.conditions has the ComparisonError; see docs/runbooks/argo-sync-stuck.md.
        - alert: ArgoAppDegraded
          expr: max by (name, dest_namespace, health_status) (argocd_app_info{health_status=~"Degraded|Missing"}) == 1
          for: 5m
          labels: { severity: critical, component: argocd }
          annotations:
            summary: Application {{ $labels.name }} is {{ $labels.health_status }}
        # Every Application sets retry.limit -1, so a failing sync never completes: the controller sets each
        # failed attempt back to phase Running, and argocd_app_sync_total does not move. What does hold is
        # .operation, which clears only when an operation completes, and it shows as operation="sync".
        # Measured during that retry loop, on a throwaway Application refused by its project: no condition is
        # set, so argocd_app_condition would not help even if it were switched on.
        #
        # So "still open" is the signal, and for: separates failing from slow. Sync operations measured on
        # this cluster: under 2m on commits that pulled no new image, 58s on promotion 4f622e3 (its layers were
        # already on the node, each pull under 0.4s), 448s for wave 3 alone when a first boot pulled four images
        # through the mirror, 6 to 10m for a chart's first boot. No measured promotion has pulled new layers, so
        # that margin against 15m is still unproven. On a first boot plane-dev's operation stays open while it waits on
        # scripts/infisical-bootstrap.sh, 34m on the only one so far, so this rule is expected to fire for it. That is
        # expected and not seen, because this form went live at 23:06Z, after that boot. ArgoAppDegraded did fire for that
        # wait, from 21:17:30Z to 21:26Z.
        #
        # A bad image in a Plane Deployment holds the operation open: Deployments are wave 3 and routes wave 4, so
        # the sync waits on the rollout, fails when it misses its 600s deadline, retries, and reaches this rule at
        # 15m if nobody reverts. Only a single-wave chart Application closes on apply: this rule never sees it, and
        # ArgoAppDegraded reports it once the rollout misses its deadline.
        # tests/drills/failed-deploy-rollback.sh, on plane-dev, reverts at the first Degraded, about 10 to 11m in, because
        # the Deployment is applied after the migrator hook. Two margins then run. ArgoAppDegraded fires once Degraded has
        # held 5m. This rule fires if the operation is still open just past 13m from its start, because max_over_time holds
        # it true for 2m after its last open sample, and that leaves about 2 to 3m from the first Degraded, an estimate. A
        # retry backs off from 30s, doubling, and goes through the hook again, so the revert may not fit, and then this rule
        # fires in the drill. Until then, what should show is this rule pending, ArgoAppStuckProgressing pending on the
        # same series until 2m after its last Progressing sample, and ArgoAppDegraded pending from the first Degraded, so
        # all three for about 90s. That is expected, not measured: the drill has not been run with these rules.
        #
        # max_over_time rides out a missed scrape, as when the controller is slow to restart, and aggregating
        # drops the pod and instance labels that a restart changes. Either would otherwise start for: again.
        - alert: ArgoSyncFailed
          expr: max by (name, dest_namespace) (max_over_time(argocd_app_info{operation="sync",name!="root"}[2m])) == 1
          for: 15m
          labels: { severity: critical, component: argocd, phase: Running }
          annotations:
            summary: Application {{ $labels.name }} has had a sync Running for 15m
            description: Under retry.limit -1 a failed attempt goes back to Running, so this is a retry loop or a wave waiting on something that never gets healthy. status.operationState.message has the error; see docs/runbooks/argo-sync-stuck.md.
        # A child whose objects never turn healthy, with no operation left open. A single-wave chart child closes
        # its operation on apply, then reads Synced and Progressing for as long as a StatefulSet or DaemonSet stays
        # unready, and neither of those has a deadline that would turn it Degraded. Root waits on it with no retry.
        # On the first boot measured, kube-prometheus-stack took about 10m to its first Healthy, pulling images, and read
        # Degraded for 9m20s of it, under the built-in check the override in helm/values/argocd.yaml has since replaced. It
        # then kept falling back while Grafana's sidecars were being OOM-killed, and each Healthy lasted 19 to 40s, inside
        # the 2m window. So this expression read true for all 25m of that which has metrics, and the state ran from
        # 20:57:36Z in the timeline to about 21:30Z in that query, about 33m, past for: by about 3m. That was a real fault,
        # and the 30m has margin only against the 10m. It includes open operations too, so that one opening does not start
        # for: again. Root is left out: it only repeats its child.
        - alert: ArgoAppStuckProgressing
          expr: max by (name, dest_namespace) (max_over_time(argocd_app_info{health_status="Progressing",name!="root"}[2m])) == 1
          for: 30m
          labels: { severity: warning, component: argocd }
          annotations:
            summary: Application {{ $labels.name }} has read Progressing for 30m
            description: Something it deployed never turned healthy and has no deadline that would turn it Degraded, such as a StatefulSet. A root sync that reaches its wave waits on it with no retry; see "After a stuck first sync" in infrastructure/terraform/README.md.
        # Root's operation walks every wave, so it stays open while its children come up: 41m measured on a
        # first boot, and scripts/up.sh allows 50m. What fires sooner depends on the child it is waiting on:
        # - Operation still open, as for a Plane Application in wave 3 or a retry loop: ArgoSyncFailed at 15m.
        # - Operation closed and Degraded, as for a Deployment past its deadline: ArgoAppDegraded at 5m.
        # - Operation closed and Progressing, as for a stuck StatefulSet in a chart: the chart's
        #   KubeStatefulSetReplicasMismatch at 15m, ArgoAppStuckProgressing at 30m.
        # - Healthy but not Synced, which the override in helm/values/argocd.yaml reads as Progressing for root only:
        #   ArgoAppSyncUnknown or ArgoAppOutOfSync at 15m, by its sync status. ArgoAppStuckProgressing stays quiet, because
        #   the child's own series still says Healthy.
        # - A Prometheus that cannot start: nothing, because nothing evaluates rules. Only the sink notices, when
        #   Watchdog stops arriving every 5 minutes, and nothing watches for that.
        - alert: ArgoRootSyncStuck
          expr: max by (name, dest_namespace) (max_over_time(argocd_app_info{operation="sync",name="root"}[2m])) == 1
          for: 60m
          labels: { severity: warning, component: argocd }
          annotations:
            summary: The root Application has had a sync Running for 60m
        # An operation that did complete as Failed or Error: one that was terminated, as argo_wait_idle does,
        # or an Application with a finite retry limit. Argo CD will not retry that revision by itself. The
        # counter first appears at 1 on an app's first failure, and increase() reads that as zero, so a new
        # series also has to count.
        - alert: ArgoSyncFailed
          expr: |
            increase(argocd_app_sync_total{phase=~"Error|Failed"}[15m]) > 0
              or
            (argocd_app_sync_total{phase=~"Error|Failed"} unless argocd_app_sync_total{phase=~"Error|Failed"} offset 15m)
          labels: { severity: critical, component: argocd }
          annotations:
            summary: Application {{ $labels.name }} had a {{ $labels.phase }} sync in the last 15m
